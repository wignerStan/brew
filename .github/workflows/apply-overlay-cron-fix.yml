          git checkout "${BASE_SHA}" -- Library/Homebrew/utils/overlay.sh

          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}: {old!r}")
              path.write_text(text.replace(old, new, 1))

          brew = Path("bin/brew")
          bootstrap = '''source "${HOMEBREW_REPOSITORY}/Library/Homebrew/utils/overlay.sh"
          homebrew-overlay-bootstrap "$@" || exit $?
          '''
          cron_entry = '''source "${HOMEBREW_REPOSITORY}/Library/Homebrew/utils/overlay.sh"
          homebrew-overlay-bootstrap "$@" || exit $?

          # Provide a cron entry point without adding work to shell startup.
          if [[ "${1:-}" == "--overlay-sync" ]]
          then
            if (($# != 1))
            then
              echo "Usage: brew --overlay-sync" >&2
              exit 2
            fi
            if ! homebrew-overlay-truthy "${HOMEBREW_OVERLAY_ACTIVE:-}"
            then
              echo "Error: --overlay-sync requires an active per-user Homebrew overlay." >&2
              exit 1
            fi
            homebrew-overlay-sync --force || exit $?
            exit 0
          fi
          '''
          replace_once(brew, bootstrap, cron_entry)

          overlay = Path("Library/Homebrew/utils/overlay.sh")
          active = '''  if homebrew-overlay-truthy "${HOMEBREW_OVERLAY_ACTIVE:-}"
            then
              homebrew-overlay-sync || return 1
              return 0
            fi
          '''
          cron_active = '''  if homebrew-overlay-truthy "${HOMEBREW_OVERLAY_ACTIVE:-}"
            then
              [[ "${1:-}" == "--overlay-sync" ]] && return 0
              homebrew-overlay-sync || return 1
              return 0
            fi
          '''
          replace_once(overlay, active, cron_active)

          docs = Path("docs/Native-User-Overlay.md")
          text = docs.read_text()
          daily = '''Once per local system calendar day, the first active overlay invocation forces a
          structural rescan even when both generations are unchanged. The durable
          `view.day` marker is advanced only after the reconciled view and stamp are
          committed. This bounds detection of manual base-Cellar additions and removals
          without a daemon or an elapsed-time scheduler; generation changes still converge
          immediately.

          '''
          if text.count(daily) != 1:
              raise SystemExit("daily synchronization paragraph was not found exactly once")
          text = text.replace(daily, "", 1)
          text = text.replace(
              "safe, startup normally returns without traversing either Cellar.",
              "safe, startup returns without traversing either Cellar.",
              1,
          )
          marker = "var/homebrew/overlay/view.day\n"
          if text.count(marker) != 1:
              raise SystemExit("view.day managed-state entry was not found exactly once")
          text = text.replace(marker, "", 1)
          anchor = '''```sh
          /home/linuxbrew/.linuxbrew/Homebrew/Library/Homebrew/utils/overlay.sh \\
            --bump-generation /home/linuxbrew/.linuxbrew
          ```

          '''
          cron = anchor + '''## Periodic reconciliation

          Package generations converge immediately when administrator changes use this
          patched `brew`. To catch manual base-Cellar changes that bypass generation
          maintenance, each developer can schedule one forced reconciliation in their
          user crontab:

          ```cron
          17 4 * * * /home/linuxbrew/.linuxbrew/bin/brew --overlay-sync >/dev/null
          ```

          `brew --overlay-sync` loads the same inline, user, and system configuration as
          any other invocation, redirects through the user prefix, and forces a structural
          Cellar, `opt`, and linked-keg reconciliation. It is idempotent and does not add a
          shell-startup hook or package-management daemon. Standard error is left visible
          to cron so failures are reported.

          '''
          if text.count(anchor) != 1:
              raise SystemExit("generation bump example was not found exactly once")
          docs.write_text(text.replace(anchor, cron, 1))
          PY

          cat > Library/Homebrew/test/overlay_cron_sync_spec.rb <<'RUBY'
          # typed: false
          # frozen_string_literal: true

          require "fileutils"
          require "open3"

          RSpec.describe "Homebrew overlay cron synchronization" do
            it "runs the cron entry point as one forced synchronization" do
              root = mktmpdir
              prefix = root/"prefix"
              brew = prefix/"bin/brew"
              overlay = prefix/"Library/Homebrew/utils/overlay.sh"
              home = root/"home"
              user_config = home/".homebrew"
              brew.parent.mkpath
              overlay.parent.mkpath
              user_config.mkpath
              FileUtils.cp HOMEBREW_LIBRARY_PATH.parent.parent/"bin/brew", brew
              brew.chmod 0755
              (user_config/"overlay.env").write("HOMEBREW_OVERLAY_BASE_PREFIX=/local-base\n")
              overlay.write <<~'BASH'
                homebrew-overlay-bootstrap() {
                  export HOMEBREW_OVERLAY_ACTIVE=1
                }
                homebrew-overlay-truthy() {
                  [[ "${1:-}" == "1" ]]
                }
                homebrew-overlay-sync() {
                  printf '%s|%s\n' "${HOMEBREW_OVERLAY_BASE_PREFIX}" "$*"
                }
              BASH

              stdout, stderr, status = Open3.capture3(
                {
                  "HOME" => home.to_s,
                  "HOMEBREW_OVERLAY" => "1",
                  "HOMEBREW_OVERLAY_BASE_PREFIX" => "/inline-base",
                },
                brew.to_s,
                "--overlay-sync",
              )

              expect([stdout, stderr, status.success?]).to eq(["/inline-base|--force\n", "", true])
            end

            it "skips the quick startup sync before cron reconciliation" do
              script = HOMEBREW_LIBRARY_PATH/"utils/overlay.sh"
              stdout, stderr, status = Open3.capture3(
                {
                  "HOMEBREW_OVERLAY" => "1",
                  "HOMEBREW_OVERLAY_ACTIVE" => "1",
                },
                "/bin/bash",
                "-c",
                <<~'BASH',
                  source "$1"
                  homebrew-overlay-sync() { printf 'unexpected\n'; }
