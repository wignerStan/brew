name: Apply overlay cron fix

on:
  push:
    branches:
      - automation/overlay-cron-fix

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'wignerStan/brew'
    runs-on: ubuntu-24.04
    env:
