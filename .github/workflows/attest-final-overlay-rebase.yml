name: Attest final overlay rebase candidate

on:
  push:
    branches:
      - automation/refactor-overlay-final-attestation-v8-20260913
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attest-final-overlay-rebase-v8
  cancel-in-progress: false

env:
  CI: "1"
  HOMEBREW_DEVELOPER: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  FINAL_SHA: d7e36f5e161f0802d71ec62f178c41e50f9525ce
  FINAL_TREE: 40c91322ad474de2a23768ef0d0001ddb4203041
  VALIDATED_PARENT: 2ba30627d7b6f54a8351617d4c65f0039148a373
  UPSTREAM_SHA: 06cc13226bd21a04faf2aba01d4a3e4836257ce8
  CANDIDATE_BRANCH: automation/refactor-overlay-rebased-candidate-20260913
  TARGET_BRANCH: refactor/overlay-maintainability
  TARGET_BEFORE: d986308aaef0c7dd1a0a669b25fdd94723e28c2f

jobs:
  attest:
    if: github.repository == 'wignerStan/brew'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact final candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: d7e36f5e161f0802d71ec62f178c41e50f9525ce
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable ancestry, tree, branch refs, and upstream tip
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin

          git remote add upstream https://github.com/Homebrew/brew.git 2>/dev/null ||
            git remote set-url upstream https://github.com/Homebrew/brew.git
          git fetch --no-tags --prune origin \
            "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/candidate" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/target"
          git fetch --no-tags --prune upstream \
            +refs/heads/main:refs/remotes/upstream/main

          test "$(git rev-parse HEAD)" = "${FINAL_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${FINAL_TREE}"
          test "$(git rev-parse HEAD^)" = "${VALIDATED_PARENT}"
          test "$(git rev-parse HEAD^^)" = "${UPSTREAM_SHA}"
          test "$(git rev-parse refs/remotes/origin/candidate)" = "${FINAL_SHA}"
          test "$(git rev-parse refs/remotes/origin/target)" = "${TARGET_BEFORE}"
          test "$(git rev-parse refs/remotes/upstream/main)" = "${UPSTREAM_SHA}"
          test -z "$(git rev-list --merges "${UPSTREAM_SHA}..${FINAL_SHA}")"

          mapfile -t changed < <(git diff --name-only "${VALIDATED_PARENT}..${FINAL_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/overlay-validation.yml"

      - name: Validate the workflow-only delta and execute its preflight gates
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin

          git diff --check "${VALIDATED_PARENT}..${FINAL_SHA}"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/overlay-validation.yml')
          workflow = path.read_text(encoding='utf-8')
          required = [
              'persist-credentials: false',
              'refs/heads/main:refs/remotes/upstream/main',
              'git diff --check upstream/main...HEAD',
              'overlay_style_delta_check.py upstream/main HEAD',
              'overlay_style_delta_check_test.py',
              'overlay_rebase_workflow_test.sh',
              'Library/Homebrew/cmd/shellenv.sh',
              'Library/Homebrew/utils/overlay/core.sh',
          ]
          for value in required:
              if value not in workflow:
                  raise SystemExit(f'missing overlay validation safeguard: {value}')
          forbidden = [
              'origin/overlay-store...HEAD',
              'wangzheng15534-blip/brew',
              'persist-credentials: true',
          ]
          for value in forbidden:
              if value in workflow:
                  raise SystemExit(f'unsafe overlay validation setting remains: {value}')
          PY

          git diff --check upstream/main...HEAD
          while IFS= read -r ruby_file; do
            [[ -n "${ruby_file}" ]] || continue
            ruby -c "${ruby_file}" >/dev/null
          done < <(git diff --name-only upstream/main...HEAD -- '*.rb' | sort)
          bash -n \
            bin/brew \
            Library/Homebrew/cmd/shellenv.sh \
            Library/Homebrew/utils/overlay.sh \
            Library/Homebrew/utils/overlay/core.sh
          while IFS= read -r test_script; do
            bash -n "${test_script}"
          done < <(find Library/Homebrew/test/support -maxdepth 1 -name 'overlay_*.sh' -print | sort)
          python3 -m py_compile \
            Library/Homebrew/test/support/overlay_style_delta_check.py \
            Library/Homebrew/test/support/overlay_style_delta_check_test.py
          python3 Library/Homebrew/test/support/overlay_style_delta_check_test.py
          bash Library/Homebrew/test/support/overlay_rebase_workflow_test.sh "$PWD"
          python3 Library/Homebrew/test/support/overlay_style_delta_check.py upstream/main HEAD

      - name: Attest the final candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${FINAL_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${FINAL_TREE}"
          printf 'Final candidate: %s\n' "${FINAL_SHA}"
          printf 'Final tree: %s\n' "${FINAL_TREE}"
          printf 'Validated implementation parent: %s\n' "${VALIDATED_PARENT}"
