name: Finalize rebased overlay style

on:
  push:
    branches:
      - automation/refactor-overlay-style-hardening-v12-20260913
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refactor-overlay-style-hardening-v12
  cancel-in-progress: false

env:
  CI: "1"
  HOMEBREW_DEVELOPER: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  CANDIDATE_SHA: 855084723e7c6ba4d2557795ca6969fa56033b0b
  UPSTREAM_SHA: 06cc13226bd21a04faf2aba01d4a3e4836257ce8
  RESULT_BRANCH: refactor/overlay-style-hardening-v12-20260913

jobs:
  finalize:
    if: github.repository == 'wignerStan/brew'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the exact hardened candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          git remote add upstream https://github.com/Homebrew/brew.git 2>/dev/null ||
            git remote set-url upstream https://github.com/Homebrew/brew.git
          git fetch --no-tags --prune upstream \
            +refs/heads/main:refs/remotes/upstream/main
          test "$(git rev-parse upstream/main)" = "${UPSTREAM_SHA}"
          test "$(git merge-base upstream/main HEAD)" = "${UPSTREAM_SHA}"

      - name: Refactor formatter-hostile heredocs and format the shell delta
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          BACKSLASH = chr(92)
          PYTHON_HEREDOC = re.compile(r"<<(?:'PY'|\"PY\"|PY)\s*$")

          def read_lines(path: str) -> list[str]:
              return Path(path).read_text(encoding="utf-8").splitlines()

          def write_lines(path: str, lines: list[str]) -> None:
              Path(path).write_text("\n".join(lines) + "\n", encoding="utf-8")

          def replace_exact_lines(path: str, old: list[str], new: list[str]) -> None:
              lines = read_lines(path)
              matches = [
                  index
                  for index in range(len(lines) - len(old) + 1)
                  if lines[index:index + len(old)] == old
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one structural match, found {len(matches)}: {old!r}"
                  )
              start = matches[0]
              write_lines(path, lines[:start] + new + lines[start + len(old):])

          def replace_unique_line(path: str, old: str, new: str) -> None:
              lines = read_lines(path)
              matches = [index for index, line in enumerate(lines) if line == old]
              if len(matches) != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one line match, found {len(matches)}: {old!r}"
                  )
              lines[matches[0]] = new
              write_lines(path, lines)

          def externalize_python_validators(path: str) -> list[Path]:
              shell_path = Path(path)
              lines = read_lines(path)
              openers = [
                  index
                  for index, line in enumerate(lines)
                  if PYTHON_HEREDOC.search(line)
              ]
              if not openers:
                  raise SystemExit(f"{path}: expected at least one Python heredoc opener")

              stem = shell_path.stem
              if not stem.endswith("_test"):
                  raise SystemExit(f"{path}: expected a *_test.sh filename")
              validator_stem = stem.removesuffix("_test")

              rewritten: list[str] = []
              validator_paths: list[Path] = []
              cursor = 0
              for ordinal, opener in enumerate(openers, start=1):
                  if opener < cursor:
                      raise SystemExit(f"{path}: overlapping Python heredoc blocks")
                  next_opener = openers[ordinal] if ordinal < len(openers) else len(lines)
                  terminators = [
                      index
                      for index in range(opener + 1, next_opener)
                      if lines[index] == "PY"
                  ]
                  if len(terminators) != 1:
                      raise SystemExit(
                          f"{path}: block {ordinal} expected one terminator, found {len(terminators)}"
                      )

                  terminator = terminators[0]
                  body = lines[opener + 1:terminator]
                  if not body:
                      raise SystemExit(f"{path}: Python validator block {ordinal} is empty")

                  suffix = f"_{ordinal}" if len(openers) > 1 else ""
                  validator_path = shell_path.with_name(
                      f"{validator_stem}_validator{suffix}.py"
                  )
                  if validator_path.exists():
                      raise SystemExit(
                          f"{validator_path}: refusing to overwrite an existing file"
                      )
                  validator_path.write_text("\n".join(body) + "\n", encoding="utf-8")
                  compile(
                      validator_path.read_text(encoding="utf-8"),
                      str(validator_path),
                      "exec",
                  )

                  redirection = '< "${BASH_SOURCE[0]%_test.sh}_validator'
                  redirection += suffix + '.py"'
                  launcher = PYTHON_HEREDOC.sub(redirection, lines[opener])
                  rewritten.extend(lines[cursor:opener])
                  rewritten.append(launcher)
                  cursor = terminator + 1
                  validator_paths.append(validator_path)

              rewritten.extend(lines[cursor:])
              write_lines(path, rewritten)

              if any(PYTHON_HEREDOC.search(line) for line in rewritten):
                  raise SystemExit(f"{path}: Python heredoc opener remains after extraction")
              if any(line == "PY" for line in rewritten):
                  raise SystemExit(f"{path}: Python heredoc terminator remains after extraction")
              return validator_paths

          workflow = ".github/workflows/rebase-upstream-overlay.yml"
          replace_exact_lines(
              workflow,
              [
                  "          printf 'sha=%s\\n' \"${AFTER}\" >>\"${GITHUB_OUTPUT}\"",
                  "          printf 'tree=%s\\n' \"${EXPECTED_TREE}\" >>\"${GITHUB_OUTPUT}\"",
                  "          printf 'bundle_sha256=%s\\n' \"${BUNDLE_SHA256}\" >>\"${GITHUB_OUTPUT}\"",
              ],
              [
                  "          {",
                  "            printf 'sha=%s\\n' \"${AFTER}\"",
                  "            printf 'tree=%s\\n' \"${EXPECTED_TREE}\"",
                  "            printf 'bundle_sha256=%s\\n' \"${BUNDLE_SHA256}\"",
                  "          } >>\"${GITHUB_OUTPUT}\"",
              ],
          )
          replace_unique_line(
              workflow,
              "            https://github.com/${GITHUB_REPOSITORY}.git",
              "            \"https://github.com/${GITHUB_REPOSITORY}.git\"",
          )
          replace_unique_line(
              workflow,
              "              --force-with-lease=refs/heads/overlay-store:${BEFORE} " + BACKSLASH,
              "              \"--force-with-lease=refs/heads/overlay-store:${BEFORE}\" " + BACKSLASH,
          )

          replace_exact_lines(
              "Library/Homebrew/test/support/overlay_cellar_integrity_test.sh",
              [
                  "for path in " + BACKSLASH,
                  '  "${stale_rack}/user/Cellar/foo" ' + BACKSLASH,
                  '  "${stale_rack}/user/opt/foo" ' + BACKSLASH,
                  '  "${stale_rack}/user/var/homebrew/linked/foo"',
                  "do",
              ],
              [
                  "stale_paths=(",
                  '  "${stale_rack}/user/Cellar/foo"',
                  '  "${stale_rack}/user/opt/foo"',
                  '  "${stale_rack}/user/var/homebrew/linked/foo"',
                  ")",
                  'for path in "${stale_paths[@]}"',
                  "do",
              ],
          )

          validator_paths = []
          for path in [
              "Library/Homebrew/test/support/overlay_commit_boundary_test.sh",
              "Library/Homebrew/test/support/overlay_rebase_workflow_test.sh",
              "Library/Homebrew/test/support/overlay_removal_partition_test.sh",
              "Library/Homebrew/test/support/overlay_transaction_publication_durability_test.sh",
          ]:
              validator_paths.extend(externalize_python_validators(path))
          if len(validator_paths) != 5:
              raise SystemExit(
                  f"expected five extracted validators, found {len(validator_paths)}"
              )
          print("Externalized validators:")
          for validator_path in validator_paths:
              print(f"  {validator_path}")
          PY

          mapfile -d '' shell_files < <(
            git diff --name-only -z --diff-filter=ACMR \
              upstream/main...HEAD -- '*.sh'
          )
          test "${#shell_files[@]}" -gt 0
          bin/brew style --fix --display-cop-names "${shell_files[@]}"

          for shell_file in "${shell_files[@]}"; do
            bash -n "${shell_file}"
          done

          validator_files=(
            Library/Homebrew/test/support/overlay_commit_boundary_validator.py
            Library/Homebrew/test/support/overlay_rebase_workflow_validator.py
            Library/Homebrew/test/support/overlay_removal_partition_validator.py
            Library/Homebrew/test/support/overlay_transaction_publication_durability_validator_1.py
            Library/Homebrew/test/support/overlay_transaction_publication_durability_validator_2.py
          )
          for validator_file in "${validator_files[@]}"; do
            test -s "${validator_file}"
            python3 -c \
              'import ast, pathlib, sys; path = pathlib.Path(sys.argv[1]); ast.parse(path.read_text(), filename=str(path))' \
              "${validator_file}"
          done

          git diff --check
          printf 'shell_count=%s\n' "${#shell_files[@]}" >>"${GITHUB_OUTPUT}"
          printf 'validator_count=%s\n' "${#validator_files[@]}" >>"${GITHUB_OUTPUT}"

      - name: Commit the final style and maintainability repair
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false
          git config core.hooksPath /dev/null
          git add -A
          if git diff --cached --quiet; then
            echo "Final style repair produced no tracked changes." >&2
            exit 1
          fi
          git commit -m "Extract overlay validators and finish style cleanup"
          after="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${CANDIDATE_SHA}"
          printf 'after=%s\n' "${after}" >>"${GITHUB_OUTPUT}"

      - name: Run the fail-closed changed-line style gate
        shell: bash
        run: |
          set -euo pipefail
          python3 Library/Homebrew/test/support/overlay_style_delta_check.py upstream/main HEAD

      - name: Publish the style-clean candidate
        shell: bash
        env:
          AFTER: ${{ steps.commit.outputs.after }}
        run: |
          set -euo pipefail
          test -n "${AFTER}"
          if git ls-remote --exit-code --heads origin "refs/heads/${RESULT_BRANCH}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing result branch ${RESULT_BRANCH}." >&2
            exit 1
          fi
          git push origin "${AFTER}:refs/heads/${RESULT_BRANCH}"

      - name: Report the result identity
        if: always()
        shell: bash
        env:
          AFTER: ${{ steps.commit.outputs.after }}
          SHELL_COUNT: ${{ steps.repair.outputs.shell_count }}
          VALIDATOR_COUNT: ${{ steps.repair.outputs.validator_count }}
        run: |
          printf 'Style-clean candidate: %s\n' "${AFTER:-not-created}"
          printf 'Changed shell files formatted: %s\n' "${SHELL_COUNT:-unknown}"
          printf 'Python validators extracted: %s\n' "${VALIDATOR_COUNT:-unknown}"
          printf 'Result branch: %s\n' "${RESULT_BRANCH}"
