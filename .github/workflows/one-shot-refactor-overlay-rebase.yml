name: One-shot validated overlay refactor rebase

on:
  push:
    branches:
      - automation/refactor-overlay-rebase-20260913
  workflow_dispatch:

permissions: {}

concurrency:
  group: one-shot-refactor-overlay-rebase
  cancel-in-progress: false

env:
  CI: "1"
  HOMEBREW_DEVELOPER: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  SOURCE_BRANCH: fix/overlay-hardening-maintainability
  SOURCE_SHA: 011ccfad6cae49f30237af00e8506cf39dacb272
  TARGET_BRANCH: refactor/overlay-maintainability
  TARGET_BEFORE: d986308aaef0c7dd1a0a669b25fdd94723e28c2f

jobs:
  prepare:
    if: github.repository == 'wignerStan/brew'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      after: ${{ steps.candidate.outputs.after }}
      tree: ${{ steps.candidate.outputs.tree }}
      upstream: ${{ steps.candidate.outputs.upstream }}
      bundle_sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - name: Check out the one-shot coordinator without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase the hardened refactor onto current upstream main
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false
          git config core.hooksPath /dev/null
          git remote add upstream https://github.com/Homebrew/brew.git 2>/dev/null ||
            git remote set-url upstream https://github.com/Homebrew/brew.git

          git fetch --no-tags --prune origin \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/source" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/target"
          git fetch --no-tags --prune upstream \
            +refs/heads/main:refs/remotes/upstream/main

          test "$(git rev-parse refs/remotes/origin/source)" = "${SOURCE_SHA}"
          test "$(git rev-parse refs/remotes/origin/target)" = "${TARGET_BEFORE}"
          upstream="$(git rev-parse refs/remotes/upstream/main)"
          git checkout --detach "${SOURCE_SHA}"

          if ! git -c core.hooksPath=/dev/null rebase "${upstream}"; then
            echo "::error::The overlay refactor has semantic conflicts with current upstream main."
            git status --short
            while IFS= read -r conflict; do
              [[ -n "${conflict}" ]] || continue
              echo "::group::Conflict: ${conflict}"
              git diff --cc -- "${conflict}" || true
              echo "::endgroup::"
            done < <(git diff --name-only --diff-filter=U)
            git rebase --abort || true
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          foreign_repository = "wangzheng15534-blip/brew"
          workflow_path = Path(".github/workflows/rebase-upstream-overlay.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          workflow = workflow.replace(
              "    if: github.repository == 'wangzheng15534-blip/brew'\n",
              "",
          )
          workflow = workflow.replace(foreign_repository, "${GITHUB_REPOSITORY}")
          if foreign_repository in workflow:
              raise SystemExit("foreign promotion repository remains in overlay workflow")
          workflow_path.write_text(workflow, encoding="utf-8")

          test_path = Path("Library/Homebrew/test/support/overlay_rebase_workflow_test.sh")
          test = test_path.read_text(encoding="utf-8")
          test = test.replace(
              "    \"if: github.repository == 'wangzheng15534-blip/brew'\",\n",
              "",
          )
          dynamic_origin = "    'https://github.com/${GITHUB_REPOSITORY}.git',\n"
          anchor = '    "core.hooksPath /dev/null",\n'
          if dynamic_origin not in test:
              if anchor not in test:
                  raise SystemExit("overlay workflow test anchor changed")
              test = test.replace(anchor, anchor + dynamic_origin, 1)
          safety_anchor = 'if "OVERLAY_PROMOTION_TOKEN" in rebase[:promote_start]:\n'
          safety_check = (
              'if "wangzheng15534-blip/brew" in rebase:\n'
              '    raise SystemExit("overlay workflow targets a foreign repository")\n'
              'if "if: github.repository ==" in prepare:\n'
              '    raise SystemExit("overlay preparation is tied to a copied repository name")\n'
          )
          if safety_check not in test:
              if safety_anchor not in test:
                  raise SystemExit("overlay workflow safety-test anchor changed")
              test = test.replace(safety_anchor, safety_check + safety_anchor, 1)
          test_path.write_text(test, encoding="utf-8")

          docs_path = Path("docs/Overlay-Promotion-Credentials.md")
          docs = docs_path.read_text(encoding="utf-8")
          docs = docs.replace(
              "Promotion requires an environment secret named `OVERLAY_PROMOTION_TOKEN` in "
              "`wangzheng15534-blip/brew`.",
              "Promotion requires an environment secret named `OVERLAY_PROMOTION_TOKEN` in "
              "the repository that runs the workflow.",
          )
          docs_path.write_text(docs, encoding="utf-8")
          PY

          git diff --check
          git add \
            .github/workflows/rebase-upstream-overlay.yml \
            Library/Homebrew/test/support/overlay_rebase_workflow_test.sh \
            docs/Overlay-Promotion-Credentials.md
          if ! git diff --cached --quiet; then
            git commit -m "Make overlay promotion repository-local"
          fi

          after="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          git merge-base --is-ancestor "${upstream}" "${after}"
          test -z "$(git rev-list --merges "${upstream}..${after}")"
          printf 'after=%s\n' "${after}" >>"${GITHUB_OUTPUT}"
          printf 'tree=%s\n' "${tree}" >>"${GITHUB_OUTPUT}"
          printf 'upstream=%s\n' "${upstream}" >>"${GITHUB_OUTPUT}"

      - name: Create a hash-addressed candidate bundle
        id: bundle
        shell: bash
        env:
          AFTER: ${{ steps.candidate.outputs.after }}
          EXPECTED_TREE: ${{ steps.candidate.outputs.tree }}
          UPSTREAM: ${{ steps.candidate.outputs.upstream }}
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin

          test "$(git rev-parse HEAD)" = "${AFTER}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${EXPECTED_TREE}"
          git merge-base --is-ancestor "${UPSTREAM}" "${AFTER}"

          bundle_dir="${RUNNER_TEMP}/refactor-overlay-candidate"
          install -d -m 0700 "${bundle_dir}"
          bundle="${bundle_dir}/candidate.bundle"
          candidate_ref=refs/overlay-bundle/refactor-candidate
          git update-ref "${candidate_ref}" "${AFTER}"
          trap 'git update-ref -d refs/overlay-bundle/refactor-candidate' EXIT
          git bundle create "${bundle}" "${candidate_ref}" "^${UPSTREAM}"
          git bundle verify "${bundle}"
          sha256="$(sha256sum "${bundle}" | awk '{print $1}')"
          test "${#sha256}" -eq 64
          printf 'sha256=%s\n' "${sha256}" >>"${GITHUB_OUTPUT}"

      - name: Upload the immutable rebased candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refactor-overlay-rebase-candidate
          path: ${{ runner.temp }}/refactor-overlay-candidate/candidate.bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  validate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      validated_sha: ${{ steps.attest.outputs.sha }}
      validated_tree: ${{ steps.attest.outputs.tree }}
      validated_bundle_sha256: ${{ steps.attest.outputs.bundle_sha256 }}
    steps:
      - name: Check out a clean repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download the exact candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: refactor-overlay-rebase-candidate
          path: ${{ runner.temp }}/refactor-overlay-candidate

      - name: Verify and import the exact candidate
        shell: bash
        env:
          AFTER: ${{ needs.prepare.outputs.after }}
          EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
          BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin

          bundle="${RUNNER_TEMP}/refactor-overlay-candidate/candidate.bundle"
          test "$(sha256sum "${bundle}" | awk '{print $1}')" = "${BUNDLE_SHA256}"
          git config core.hooksPath /dev/null
          git remote add upstream https://github.com/Homebrew/brew.git 2>/dev/null ||
            git remote set-url upstream https://github.com/Homebrew/brew.git
          git fetch --no-tags --prune upstream \
            +refs/heads/main:refs/remotes/upstream/main
          git cat-file -e "${UPSTREAM}^{commit}"
          git merge-base --is-ancestor "${UPSTREAM}" refs/remotes/upstream/main
          git bundle verify "${bundle}"
          bundle_refs="$(git bundle unbundle "${bundle}")"
          bundle_sha="$(
            printf '%s\n' "${bundle_refs}" |
              awk '$2 == "refs/overlay-bundle/refactor-candidate" { print $1 }'
          )"
          test "${bundle_sha}" = "${AFTER}"
          git checkout --detach "${AFTER}"
          test "$(git rev-parse HEAD)" = "${AFTER}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${EXPECTED_TREE}"
          git merge-base --is-ancestor "${UPSTREAM}" "${AFTER}"

      - name: Validate patch formatting and source syntax
        shell: bash
        env:
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
        run: |
          set -euo pipefail
          git diff --check "${UPSTREAM}...HEAD"
          bash -n \
            bin/brew \
            Library/Homebrew/utils/overlay.sh \
            Library/Homebrew/utils/overlay/core.sh
          while IFS= read -r test_script; do
            bash -n "${test_script}"
          done < <(find Library/Homebrew/test/support -maxdepth 1 -name 'overlay_*.sh' -print | sort)
          python3 -m py_compile \
            Library/Homebrew/test/support/overlay_style_delta_check.py \
            Library/Homebrew/test/support/overlay_style_delta_check_test.py
          python3 Library/Homebrew/test/support/overlay_style_delta_check_test.py
          bash Library/Homebrew/test/support/overlay_rebase_workflow_test.sh "$PWD"

      - name: Run the complete overlay recovery matrix
        shell: bash
        run: |
          set -euo pipefail
          bash Library/Homebrew/test/support/overlay_final_review_reproducer.sh "$PWD"

      - name: Run the full Homebrew RSpec suite
        shell: bash
        run: |
          set -euo pipefail
          bin/brew tests --no-parallel

      - name: Reject style offenses on the rebased overlay delta
        shell: bash
        env:
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
        run: |
          set -euo pipefail
          python3 Library/Homebrew/test/support/overlay_style_delta_check.py "${UPSTREAM}" HEAD

      - name: Run Sorbet
        shell: bash
        run: |
          set -euo pipefail
          bin/brew typecheck

      - name: Attest the exact validated candidate
        id: attest
        shell: bash
        env:
          AFTER: ${{ needs.prepare.outputs.after }}
          EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
          BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/refactor-overlay-candidate/candidate.bundle"
          test "$(git rev-parse HEAD)" = "${AFTER}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${EXPECTED_TREE}"
          test "$(sha256sum "${bundle}" | awk '{print $1}')" = "${BUNDLE_SHA256}"
          printf 'sha=%s\n' "${AFTER}" >>"${GITHUB_OUTPUT}"
          printf 'tree=%s\n' "${EXPECTED_TREE}" >>"${GITHUB_OUTPUT}"
          printf 'bundle_sha256=%s\n' "${BUNDLE_SHA256}" >>"${GITHUB_OUTPUT}"

  promote:
    needs: [prepare, validate]
    if: needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the exact validated bundle on a fresh runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: refactor-overlay-rebase-candidate
          path: ${{ runner.temp }}/refactor-overlay-candidate

      - name: Promote the verified commit without executing candidate files
        shell: bash
        env:
          AFTER: ${{ needs.prepare.outputs.after }}
          EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
          BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle_sha256 }}
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
          VALIDATED_TREE: ${{ needs.validate.outputs.validated_tree }}
          VALIDATED_BUNDLE_SHA256: ${{ needs.validate.outputs.validated_bundle_sha256 }}
          PUSH_TOKEN: ${{ secrets.OVERLAY_PROMOTION_TOKEN || github.token }}
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin

          test -n "${PUSH_TOKEN}"
          test "${AFTER}" = "${VALIDATED_SHA}"
          test "${EXPECTED_TREE}" = "${VALIDATED_TREE}"
          test "${BUNDLE_SHA256}" = "${VALIDATED_BUNDLE_SHA256}"

          isolated_home="$(mktemp -d)"
          repository="$(mktemp -d)"
          template_dir="$(mktemp -d)"
          askpass="$(mktemp)"
          trap 'rm -rf "${isolated_home}" "${repository}" "${template_dir}"; rm -f "${askpass}"' EXIT
          export HOME="${isolated_home}"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_TEMPLATE_DIR="${template_dir}"

          cat >"${askpass}" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *) printf '%s\n' "${PUSH_TOKEN:?}" ;;
          esac
          ASKPASS
          chmod 0700 "${askpass}"

          bundle="${RUNNER_TEMP}/refactor-overlay-candidate/candidate.bundle"
          test "$(sha256sum "${bundle}" | awk '{print $1}')" = "${BUNDLE_SHA256}"

          git init "${repository}"
          git -C "${repository}" config core.hooksPath /dev/null
          git -C "${repository}" config transfer.fsckObjects true
          git -C "${repository}" config fetch.fsckObjects true
          git -C "${repository}" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${repository}" remote add upstream \
            https://github.com/Homebrew/brew.git

          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git -C "${repository}" -c protocol.ext.allow=never \
              fetch --no-tags --prune origin \
              "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          GIT_TERMINAL_PROMPT=0 \
            git -C "${repository}" -c protocol.ext.allow=never \
              fetch --no-tags --prune upstream \
              +refs/heads/main:refs/remotes/upstream/main

          test "$(git -C "${repository}" rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "${TARGET_BEFORE}"
          git -C "${repository}" cat-file -e "${UPSTREAM}^{commit}"
          git -C "${repository}" merge-base --is-ancestor \
            "${UPSTREAM}" refs/remotes/upstream/main

          git -C "${repository}" bundle verify "${bundle}"
          bundle_refs="$(git -C "${repository}" bundle unbundle "${bundle}")"
          bundle_sha="$(
            printf '%s\n' "${bundle_refs}" |
              awk '$2 == "refs/overlay-bundle/refactor-candidate" { print $1 }'
          )"
          test "${bundle_sha}" = "${AFTER}"
          test "$(git -C "${repository}" rev-parse "${AFTER}^{tree}")" = "${EXPECTED_TREE}"
          git -C "${repository}" merge-base --is-ancestor "${UPSTREAM}" "${AFTER}"
          test -z "$(git -C "${repository}" rev-list --merges "${UPSTREAM}..${AFTER}")"

          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git -C "${repository}" push \
              --force-with-lease="refs/heads/${TARGET_BRANCH}:${TARGET_BEFORE}" \
              origin "${AFTER}:refs/heads/${TARGET_BRANCH}"
