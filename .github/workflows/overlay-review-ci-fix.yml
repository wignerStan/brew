name: Validate final overlay review fixes

on:
  push:
    branches:
      - automation/overlay-review-ci-fix
    paths:
      - .github/workflows/overlay-review-ci-fix.yml

permissions:
  contents: write

env:
  CI: "1"
  HOMEBREW_DEVELOPER: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/overlay-review-hardening
          fetch-depth: 0

      - name: Fetch validated fixer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "68353eca5d9034d10c5c055375e99ae4a47be564"
          test "$(git rev-parse origin/overlay-store)" = "2b0f7e28d76e2d51fb75e28f0bc71f00dabd4a5c"
          git show origin/automation/overlay-review-ci-fix:.github/overlay-review-fix.py >"$RUNNER_TEMP/overlay-review-fix.py"
          python3 - "$RUNNER_TEMP/overlay-review-fix.py" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          blocks = [
              '''replace(
              "Library/Homebrew/overlay.rb",
              "      rescue Exception # rubocop:disable Lint/RescueException\\n",
              "      # Rescue Exception intentionally so recovery runs before non-StandardError interrupts are re-raised.\\n"
              "      rescue Exception # rubocop:disable Lint/RescueException\\n",
              count=1,
          )
          ''',
              '''replace(
              "Library/Homebrew/test/overlay_spec.rb",
              "    opened_marker&.rename(marker) if opened_marker&.exist?\\n",
              "    opened_marker&.rename(T.must(marker)) if opened_marker&.exist?\\n",
          )
          ''',
          ]
          for block in blocks:
              if block not in text:
                  raise SystemExit(f"staged fixer block not found: {block.splitlines()[1:3]}")
              text = text.replace(block, "", 1)
          path.write_text(text)
          PY

      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/overlay-review-fix.py"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Library/Homebrew/overlay.rb")
          text = path.read_text()
          old = '''        Overlay.durable_atomic_write!(@metadata_state, "backed-up\\n", mode: 0600)
                  Overlay.clear_caches!
                  self
                rescue Exception # rubocop:disable Lint/RescueException
          '''
          new = '''        Overlay.durable_atomic_write!(@metadata_state, "backed-up\\n", mode: 0600)
                  Overlay.clear_caches!
                  self
                # Rescue Exception intentionally so recovery runs before non-StandardError interrupts are re-raised.
                rescue Exception # rubocop:disable Lint/RescueException
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one reinstall rescue context, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          bash -n bin/brew Library/Homebrew/utils/overlay.sh
          while IFS= read -r test_script; do
            bash -n "$test_script"
          done < <(find Library/Homebrew/test/support -maxdepth 1 -name 'overlay_*.sh' -print | sort)
          python3 -m py_compile Library/Homebrew/test/support/overlay_style_delta_check.py

      - name: Require zero-error Sorbet
        shell: bash
        run: |
          set -euo pipefail
          bin/brew typecheck

      - name: Require clean changed-line style
        shell: bash
        run: |
          set -euo pipefail
          python3 Library/Homebrew/test/support/overlay_style_delta_check.py origin/overlay-store HEAD

      - name: Run affected specs
        shell: bash
        run: |
          set -euo pipefail
          bin/brew tests --no-parallel \
            --only=overlay,formula_installer,formula_pin,cmd/overlay-sync,uninstall,cmd/link,cmd/bundle/cleanup_subcommand

      - name: Run complete overlay recovery matrix
        shell: bash
        run: |
          set -euo pipefail
          bash Library/Homebrew/test/support/overlay_final_review_reproducer.sh "$PWD"

      - name: Run full Homebrew RSpec suite
        shell: bash
        run: |
          set -euo pipefail
          bin/brew tests --no-parallel

      - name: Commit exact validated review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "openai@example.invalid"
          git add \
            .github/workflows/overlay-validation.yml \
            .github/workflows/rebase-upstream-overlay.yml \
            Library/Homebrew/formula_installer.rb \
            Library/Homebrew/formula_pin.rb \
            Library/Homebrew/install.rb \
            Library/Homebrew/overlay.rb \
            Library/Homebrew/sorbet/rbi/dsl/homebrew/env_config.rbi \
            Library/Homebrew/test/cmd/overlay-sync_spec.rb \
            Library/Homebrew/test/formula_installer_spec.rb \
            Library/Homebrew/test/overlay_spec.rb \
            Library/Homebrew/test/support/overlay_rebase_workflow_test.sh \
            Library/Homebrew/test/support/overlay_removal_partition_test.sh \
            Library/Homebrew/test/support/overlay_reinstall_recovery_test.sh \
            Library/Homebrew/test/support/overlay_style_delta_check.py
          git diff --cached --check
          git commit -m "Harden overlay review validation"
          git push origin HEAD:refs/heads/fix/overlay-review-hardening
