name: Report overlay hardening style offenses

on:
  push:
    branches:
      - automation/overlay-review-ci-fix
    paths:
      - .github/workflows/overlay-review-ci-fix.yml

permissions:
  contents: read

env:
  CI: "1"
  HOMEBREW_DEVELOPER: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  report-style:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/overlay-review-hardening
          fetch-depth: 0

      - name: Report candidate style output safely
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "68353eca5d9034d10c5c055375e99ae4a47be564"
          mapfile -t changed < <(
            git diff --name-only --diff-filter=ACMR origin/overlay-store...HEAD -- \
              '*.rb' '*.rbi' '*.sh' '*.yml' '*.yaml' bin/brew
          )
          log="$RUNNER_TEMP/candidate-style.log"
          set +e
          bin/brew style --display-cop-names "${changed[@]}" >"$log" 2>&1
          status=$?
          set -e
          echo "style status=$status"
          python3 - "$log" <<'PY'
          import re
          import sys

          ansi = re.compile(r"\x1b\[[0-9;]*m")
          rubocop = re.compile(r"^.*?:\d+:\d+: [A-Z]: ")
          with open(sys.argv[1], encoding="utf-8", errors="replace") as handle:
              for raw in handle:
                  line = ansi.sub("", raw.rstrip("\n"))
                  if rubocop.match(line) or line.startswith("::error") or "shellcheck" in line.lower():
                      print(repr(line))
          PY
