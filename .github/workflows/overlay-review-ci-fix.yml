name: Preview safe overlay style autocorrections

on:
  push:
    branches:
      - automation/overlay-review-ci-fix
    paths:
      - .github/workflows/overlay-review-ci-fix.yml

permissions:
  contents: read

env:
  CI: "1"
  HOMEBREW_DEVELOPER: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/overlay-review-hardening
          fetch-depth: 0

      - name: Apply safe autocorrections and report remaining issues
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "68353eca5d9034d10c5c055375e99ae4a47be564"
          mapfile -t changed < <(
            git diff --name-only --diff-filter=ACMR origin/overlay-store...HEAD -- \
              '*.rb' '*.rbi' '*.sh' '*.yml' '*.yaml' bin/brew
          )
          set +e
          bin/brew style --fix "${changed[@]}" >"$RUNNER_TEMP/fix.log" 2>&1
          fix_status=$?
          bin/brew style --display-cop-names "${changed[@]}" >"$RUNNER_TEMP/remaining.log" 2>&1
          remaining_status=$?
          set -e
          echo "fix status=$fix_status remaining status=$remaining_status"
          git diff --stat
          echo '--- remaining relevant diagnostics ---'
          python3 - "$RUNNER_TEMP/remaining.log" <<'PY'
          import re
          import sys
          ansi = re.compile(r"\x1b\[[0-9;]*m")
          with open(sys.argv[1], encoding="utf-8", errors="replace") as handle:
              for raw in handle:
                  line = ansi.sub("", raw.rstrip("\n"))
                  if re.match(r"^.*?:\d+:\d+: [A-Z]: ", line) or line.startswith("::error"):
                      print(repr(line))
          PY
          echo '--- autocorrection diff ---'
          git diff --unified=1 -- \
            Library/Homebrew/overlay.rb \
            Library/Homebrew/formula_pin.rb \
            Library/Homebrew/test/cmd/overlay-sync_spec.rb \
            Library/Homebrew/test/formula_installer_spec.rb \
            .github/workflows/rebase-upstream-overlay.yml \
            Library/Homebrew/test/support/overlay_reinstall_recovery_test.sh | head -n 1200
