name: Check overlay-store Sorbet baseline

on:
  push:
    branches:
      - automation/overlay-review-ci-fix
    paths:
      - .github/workflows/overlay-review-ci-fix.yml

permissions:
  contents: read

env:
  CI: "1"
  HOMEBREW_DEVELOPER: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  baseline-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out overlay-store baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: overlay-store
          fetch-depth: 1

      - name: Verify baseline SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2b0f7e28d76e2d51fb75e28f0bc71f00dabd4a5c"

      - name: Run baseline Sorbet
        shell: bash
        run: |
          set -euo pipefail
          bin/brew typecheck
