name: Audit overlay hardening style delta

on:
  push:
    branches:
      - automation/overlay-review-ci-fix
    paths:
      - .github/workflows/overlay-review-ci-fix.yml

permissions:
  contents: read

env:
  CI: "1"
  HOMEBREW_DEVELOPER: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  audit-style-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reviewed hardening head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/overlay-review-hardening
          fetch-depth: 0

      - name: Verify exact review boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "68353eca5d9034d10c5c055375e99ae4a47be564"
          test "$(git rev-parse origin/overlay-store)" = "2b0f7e28d76e2d51fb75e28f0bc71f00dabd4a5c"

      - name: Compare RuboCop offense signatures with overlay-store
        shell: bash
        run: |
          set -euo pipefail
          candidate_log="$RUNNER_TEMP/candidate-style.log"
          baseline_log="$RUNNER_TEMP/baseline-style.log"
          changed_file="$RUNNER_TEMP/changed-files"
          base_file="$RUNNER_TEMP/base-files"

          git diff --name-only --diff-filter=ACMR origin/overlay-store...HEAD -- \
            '*.rb' '*.rbi' '*.sh' '*.yml' '*.yaml' bin/brew >"$changed_file"

          set +e
          mapfile -t changed <"$changed_file"
          bin/brew style --display-cop-names "${changed[@]}" >"$candidate_log" 2>&1
          candidate_status=$?
          set -e
          echo "candidate style status=$candidate_status"

          git worktree add --detach "$RUNNER_TEMP/overlay-store" origin/overlay-store
          while IFS= read -r file; do
            [[ -e "$RUNNER_TEMP/overlay-store/$file" ]] && printf '%s\n' "$file"
          done <"$changed_file" >"$base_file"

          set +e
          (
            cd "$RUNNER_TEMP/overlay-store"
            mapfile -t base_files <"$base_file"
            if ((${#base_files[@]})); then
              bin/brew style --display-cop-names "${base_files[@]}"
            fi
          ) >"$baseline_log" 2>&1
          baseline_status=$?
          set -e
          echo "baseline style status=$baseline_status"

          python3 - "$baseline_log" "$candidate_log" <<'PY'
          import collections
          import re
          import sys

          ansi = re.compile(r"\x1b\[[0-9;]*m")
          offense = re.compile(r"^(.*?):\d+:\d+: [A-Z]: ([^:]+): (.*)$")

          def signatures(path):
              result = collections.Counter()
              with open(path, encoding="utf-8", errors="replace") as handle:
                  for raw in handle:
                      line = ansi.sub("", raw.rstrip("\n"))
                      match = offense.match(line)
                      if match:
                          filename = match.group(1)
                          marker = "Library/Homebrew/"
                          if marker in filename:
                              filename = filename.split(marker, 1)[1]
                          result[(filename, match.group(2), match.group(3))] += 1
              return result

          baseline = signatures(sys.argv[1])
          candidate = signatures(sys.argv[2])
          new = candidate - baseline
          print(f"baseline offenses={sum(baseline.values())}")
          print(f"candidate offenses={sum(candidate.values())}")
          print(f"new offenses={sum(new.values())}")
          for key, count in sorted(new.items()):
              print("NEW", count, key)
          PY

          echo '--- candidate style tail ---'
          tail -n 40 "$candidate_log" || true
