name: Fix overlay Sorbet debt

on:
  push:
    branches:
      - automation/overlay-review-ci-fix
    paths:
      - .github/workflows/overlay-review-ci-fix.yml

permissions:
  contents: write

env:
  CI: "1"
  HOMEBREW_DEVELOPER: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out reviewed hardening head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/overlay-review-hardening
          fetch-depth: 0

      - name: Verify expected source and target base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "68353eca5d9034d10c5c055375e99ae4a47be564"
          test "$(git rev-parse origin/overlay-store)" = "2b0f7e28d76e2d51fb75e28f0bc71f00dabd4a5c"

      - name: Fix remaining overlay Sorbet errors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old!r}")
              p.write_text(text.replace(old, new, count))

          replace(
              "Library/Homebrew/formula_installer.rb",
              "        base_generation: T.must(@overlay_base_generation),\n",
              "        base_generation: @overlay_base_generation,\n",
          )

          replace(
              "Library/Homebrew/overlay.rb",
              "    MAX_MANAGED_STATE_BYTES = 64 * 1024 * 1024\n",
              "    MAX_MANAGED_STATE_BYTES = T.let(64 * 1024 * 1024, Integer)\n",
          )
          replace(
              "Library/Homebrew/overlay.rb",
              "      rack.directory? && !rack.symlink? && keg.symlink? && inherited_keg?(keg)\n",
              "      return false unless rack.directory?\n"
              "      return false if rack.symlink?\n"
              "      return false unless keg.symlink?\n\n"
              "      inherited_keg?(keg)\n",
          )
          replace(
              "Library/Homebrew/overlay.rb",
              "        fields.each_slice(2) do |relative, target|\n"
              "          expected = expected_link_target(relative)\n",
              "        fields.each_slice(2) do |relative, target|\n"
              "          relative = T.must(relative)\n"
              "          expected = expected_link_target(relative)\n",
          )

          replace(
              "Library/Homebrew/install.rb",
              "            inherited_link = false\n",
              "            inherited_link = T.let(false, T::Boolean)\n",
          )

          replace(
              "Library/Homebrew/test/overlay_spec.rb",
              "# typed: strict\n",
              "# typed: true\n",
          )
          replace(
              "Library/Homebrew/test/overlay_spec.rb",
              "  it \"rejects a transaction marker path replaced after opening\" do\n"
              "    add_base_formula(\"foo\", \"1.0\")\n"
              "    transaction = T.must(described_class.begin_formula_transaction(formula, base_generation:))\n",
              "  it \"rejects a transaction marker path replaced after opening\" do\n"
              "    transaction = T.let(nil, T.nilable(Homebrew::Overlay::FormulaTransaction))\n"
              "    marker = T.let(nil, T.nilable(Pathname))\n"
              "    opened_marker = T.let(nil, T.nilable(Pathname))\n\n"
              "    add_base_formula(\"foo\", \"1.0\")\n"
              "    transaction = T.must(described_class.begin_formula_transaction(formula, base_generation:))\n",
          )
          replace(
              "Library/Homebrew/test/overlay_spec.rb",
              "    opened_marker&.rename(marker) if opened_marker&.exist?\n",
              "    opened_marker&.rename(T.must(marker)) if opened_marker&.exist?\n",
          )
          replace(
              "Library/Homebrew/test/overlay_spec.rb",
              "    descriptor = described_class::MUTATION_LOCK_DESCRIPTOR\n",
              "    descriptor = Homebrew::Overlay::MUTATION_LOCK_DESCRIPTOR\n",
          )

          replace(
              "Library/Homebrew/sorbet/rbi/dsl/homebrew/env_config.rbi",
              "    sig { returns(T::Boolean) }\n"
              "    def no_verify_attestations?; end\n\n"
              "    sig { returns(String) }\n"
              "    def pip_index_url; end\n",
              "    sig { returns(T::Boolean) }\n"
              "    def no_verify_attestations?; end\n\n"
              "    sig { returns(T::Boolean) }\n"
              "    def overlay?; end\n\n"
              "    sig { returns(T::Boolean) }\n"
              "    def overlay_active?; end\n\n"
              "    sig { returns(T.nilable(::String)) }\n"
              "    def overlay_base_prefix; end\n\n"
              "    sig { returns(T::Boolean) }\n"
              "    def overlay_force?; end\n\n"
              "    sig { returns(T.nilable(::String)) }\n"
              "    def overlay_user_prefix; end\n\n"
              "    sig { returns(String) }\n"
              "    def pip_index_url; end\n",
          )
          PY

          bin/brew style --fix \
            Library/Homebrew/formula_installer.rb \
            Library/Homebrew/install.rb \
            Library/Homebrew/overlay.rb \
            Library/Homebrew/test/overlay_spec.rb \
            Library/Homebrew/sorbet/rbi/dsl/homebrew/env_config.rbi
          bin/brew style \
            Library/Homebrew/formula_installer.rb \
            Library/Homebrew/install.rb \
            Library/Homebrew/overlay.rb \
            Library/Homebrew/test/overlay_spec.rb \
            Library/Homebrew/sorbet/rbi/dsl/homebrew/env_config.rbi
          git diff --check

      - name: Require clean Sorbet
        shell: bash
        run: |
          set -euo pipefail
          bin/brew typecheck

      - name: Run complete overlay recovery matrix
        shell: bash
        run: |
          set -euo pipefail
          bash Library/Homebrew/test/support/overlay_final_review_reproducer.sh "$PWD"

      - name: Run full Homebrew RSpec suite
        shell: bash
        run: |
          set -euo pipefail
          bin/brew tests --no-parallel

      - name: Commit exact validated Sorbet fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "openai@example.invalid"
          git add \
            Library/Homebrew/formula_installer.rb \
            Library/Homebrew/install.rb \
            Library/Homebrew/overlay.rb \
            Library/Homebrew/test/overlay_spec.rb \
            Library/Homebrew/sorbet/rbi/dsl/homebrew/env_config.rbi
          git diff --cached --check
          git commit -m "Make overlay validation typecheck clean"
          git push origin HEAD:refs/heads/fix/overlay-review-hardening
