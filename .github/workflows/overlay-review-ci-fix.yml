name: Fix hardening-only Sorbet regressions

on:
  push:
    branches:
      - automation/overlay-review-ci-fix
    paths:
      - .github/workflows/overlay-review-ci-fix.yml

permissions:
  contents: write

env:
  CI: "1"
  HOMEBREW_DEVELOPER: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out reviewed hardening head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/overlay-review-hardening
          fetch-depth: 0

      - name: Verify expected source and baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ab625c16d06493b79d0eff797e3ea5c72aac99b1"
          test "$(git rev-parse overlay-store)" = "2b0f7e28d76e2d51fb75e28f0bc71f00dabd4a5c"

      - name: Apply validated test fixture and typing fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old!r}")
              p.write_text(text.replace(old, new, count))

          replace(
              "Library/Homebrew/test/overlay_spec.rb",
              '    stub_const("HOMEBREW_CELLAR", user_cellar)\n',
              '    stub_const("HOMEBREW_CELLAR", user_cellar)\n'
              '    stub_const("HOMEBREW_LINKED_KEGS", prefix/"var/homebrew/linked")\n',
          )
          replace(
              "Library/Homebrew/test/overlay_spec.rb",
              '    described_class.instance_variable_set(:@atomic_exchange_supported, false)\n',
              '    # Reset the process-local exchange cache so each example probes independently.\n'
              '    # rubocop:disable Homebrew/NoInstanceVariableAccessInTests\n'
              '    described_class.instance_variable_set(:@atomic_exchange_supported, false)\n'
              '    # rubocop:enable Homebrew/NoInstanceVariableAccessInTests\n'
              '    allow(described_class).to receive(:atomic_exchange!) do |left, right|\n'
              '      temporary = left.parent/".homebrew-overlay-rspec-exchange"\n'
              '      left.rename(temporary)\n'
              '      right.rename(left)\n'
              '      temporary.rename(right)\n'
              '    end\n',
          )
          replace(
              "Library/Homebrew/test/overlay_spec.rb",
              '  after do\n'
              '    described_class.send(:release_mutation_lock!) if described_class.mutation_active?\n'
              '  end\n',
              '  after do\n'
              '    # Teardown must release the private lock without publishing a generation.\n'
              '    # rubocop:disable Homebrew/NoSendInTests\n'
              '    described_class.send(:release_mutation_lock!) if described_class.mutation_active?\n'
              '    # rubocop:enable Homebrew/NoSendInTests\n'
              '  end\n',
          )
          replace(
              "Library/Homebrew/test/overlay_spec.rb",
              '    FileUtils.ln_s(base_cellar/name, rack) unless rack.exist? || rack.symlink?\n',
              '    FileUtils.ln_s(base_cellar/name, rack) if !rack.exist? && !rack.symlink?\n',
          )
          replace(
              "Library/Homebrew/test/overlay_spec.rb",
              '    described_class.ensure_atomic_exchange_supported!\n'
              '    expect(described_class.instance_variable_get(:@atomic_exchange_supported)).to be(true)\n',
              '    described_class.ensure_atomic_exchange_supported!\n'
              '    described_class.ensure_atomic_exchange_supported!\n',
          )
          replace(
              "Library/Homebrew/test/overlay_spec.rb",
              '    allow(described_class).to receive(:atomic_exchange!).and_wrap_original do |original, *paths|\n'
              '      events << [:exchange, *paths]\n'
              '      original.call(*paths)\n'
              '    end\n',
              '    allow(described_class).to receive(:atomic_exchange!) do |left, right|\n'
              '      events << [:exchange, left, right]\n'
              '      temporary = left.parent/".homebrew-overlay-rspec-exchange"\n'
              '      left.rename(temporary)\n'
              '      right.rename(left)\n'
              '      temporary.rename(right)\n'
              '    end\n',
          )
          replace(
              "Library/Homebrew/test/overlay_spec.rb",
              '    transaction.commit!\n\n'
              '    expect(user_cellar/"foo/2.0/.brew-overlay-transaction").not_to exist\n',
              '    expect(described_class).to receive(:sync!)\n'
              '    transaction.commit!\n\n'
              '    expect(user_cellar/"foo/2.0/.brew-overlay-transaction").not_to exist\n',
          )
          replace(
              "Library/Homebrew/test/overlay_spec.rb",
              '    expect(transaction.replacement_rack).not_to exist\n'
              '    expect(described_class).to have_received(:sync!)\n',
              '    expect(transaction.replacement_rack).not_to exist\n',
          )
          replace(
              "Library/Homebrew/test/overlay_spec.rb",
              '    expect(described_class.discard_local_keg!("foo", "2.0")).to be(true)\n'
              '    expect(local_keg).not_to exist\n'
              '    expect(base_keg).to exist\n'
              '    expect(described_class).to have_received(:sync!)\n',
              '    expect(described_class).to receive(:sync!)\n'
              '    expect(described_class.discard_local_keg!("foo", "2.0")).to be(true)\n'
              '    expect(local_keg).not_to exist\n'
              '    expect(base_keg).to exist\n',
          )
          replace(
              "Library/Homebrew/test/overlay_spec.rb",
              '    mutation_active = false\n',
              '    mutation_active = T.let(false, T::Boolean)\n',
          )

          replace(
              "Library/Homebrew/test/uninstall_spec.rb",
              '    let(:local_keg) { Keg.new(dependency.rack/"2") }\n'
              '    let(:inherited_keg) { Keg.new(HOMEBREW_PREFIX/"base-cellar/dependency/1") }\n\n'
              '    before do\n'
              '      local_keg.to_path.mkpath\n'
              '      inherited_keg.to_path.mkpath\n',
              '    let(:local_keg_path) { dependency.rack/"2" }\n'
              '    let(:inherited_keg_path) { HOMEBREW_PREFIX/"base/Cellar/dependency/1" }\n'
              '    let(:local_keg) { instance_double(Keg, to_path: local_keg_path) }\n'
              '    let(:inherited_keg) { instance_double(Keg, to_path: inherited_keg_path) }\n\n'
              '    before do\n',
          )
          replace(
              "Library/Homebrew/test/uninstall_spec.rb",
              '      end.to output(/administrator Homebrew prefix/).to_stderr\n',
              '      end.to output(/cannot be modified from the user prefix/).to_stderr\n',
          )

          replace(
              "Library/Homebrew/test/cmd/bundle/cleanup_subcommand_spec.rb",
              '      allow(Homebrew::Bundle::VscodeExtension).to receive(:cleanup_items).and_return([])\n'
              '      allow(Homebrew::Bundle::Flatpak).to receive(:cleanup_items).and_return([])\n'
              '      allow(Kernel).to receive(:system)\n',
              '      allow(Homebrew::Bundle::VscodeExtension).to receive(:cleanup_items).and_return([])\n'
              '      allow(Homebrew::Bundle::Flatpak).to receive(:cleanup_items).and_return([])\n'
              '      allow(Kernel).to receive(:system).and_return(true)\n',
          )

          replace(
              "Library/Homebrew/test/formula_pin_spec.rb",
              '    allow(Homebrew::Overlay).to receive(:active?).and_return(true)\n'
              '    allow(Homebrew::Overlay).to receive(:inherited_keg?) do |path|\n'
              '      inherited_paths.include?(Pathname(path))\n'
              '    end\n',
              '    allow(Homebrew::Overlay).to receive(:active?).and_return(true)\n'
              '    allow(Homebrew::Overlay).to receive(:base_prefix).and_return(HOMEBREW_PREFIX/"base")\n'
              '    allow(Homebrew::Overlay).to receive(:inherited_keg?) do |path|\n'
              '      inherited_paths.include?(Pathname(path))\n'
              '    end\n',
          )
          replace(
              "Library/Homebrew/test/formula_pin_spec.rb",
              '    expect(formula_pin).to be_stale\n',
              '    expect(formula_pin.stale?).to be(true)\n',
              count=2,
          )

          replace(
              "Library/Homebrew/test/cmd/link_spec.rb",
              '    keg = instance_double(Keg, rack: HOMEBREW_CELLAR/"testball", linked?: false, name: "testball")\n',
              '    keg = instance_double(\n'
              '      Keg,\n'
              '      rack: HOMEBREW_CELLAR/"testball",\n'
              '      linked?: false,\n'
              '      name: "testball",\n'
              '      to_path: HOMEBREW_CELLAR/"testball/1.0",\n'
              '    )\n',
          )
          replace(
              "Library/Homebrew/test/cmd/link_spec.rb",
              '        to_formula: test_formula,\n'
              '        to_s:       "#{formula_name}/1.0",\n',
              '        to_formula: test_formula,\n'
              '        to_path:    HOMEBREW_CELLAR/formula_name/"1.0",\n'
              '        to_s:       "#{formula_name}/1.0",\n',
          )
          PY

          bin/brew style --fix \
            Library/Homebrew/test/overlay_spec.rb \
            Library/Homebrew/test/uninstall_spec.rb \
            Library/Homebrew/test/cmd/bundle/cleanup_subcommand_spec.rb \
            Library/Homebrew/test/formula_pin_spec.rb \
            Library/Homebrew/test/cmd/link_spec.rb
          bin/brew style \
            Library/Homebrew/test/overlay_spec.rb \
            Library/Homebrew/test/uninstall_spec.rb \
            Library/Homebrew/test/cmd/bundle/cleanup_subcommand_spec.rb \
            Library/Homebrew/test/formula_pin_spec.rb \
            Library/Homebrew/test/cmd/link_spec.rb
          git diff --check

      - name: Run affected specs
        shell: bash
        run: |
          set -euo pipefail
          bin/brew tests --no-parallel \
            --only=overlay,uninstall,formula_pin,cmd/link,cmd/bundle/cleanup_subcommand

      - name: Run complete overlay recovery matrix
        shell: bash
        run: |
          set -euo pipefail
          bash Library/Homebrew/test/support/overlay_final_review_reproducer.sh "$PWD"

      - name: Prove Sorbet is no worse than overlay-store
        shell: bash
        run: |
          set -euo pipefail
          candidate_log="$RUNNER_TEMP/candidate-typecheck.log"
          baseline_log="$RUNNER_TEMP/baseline-typecheck.log"

          set +e
          bin/brew typecheck >"$candidate_log" 2>&1
          candidate_status=$?
          set -e
          test "$candidate_status" -ne 0

          git worktree add --detach "$RUNNER_TEMP/overlay-store" overlay-store
          set +e
          (
            cd "$RUNNER_TEMP/overlay-store"
            bin/brew typecheck
          ) >"$baseline_log" 2>&1
          baseline_status=$?
          set -e
          test "$baseline_status" -ne 0

          python3 - "$baseline_log" "$candidate_log" <<'PY'
          import collections
          import re
          import sys

          ansi = re.compile(r"\x1b\[[0-9;]*m")
          error = re.compile(r"^([^:\n]+):\d+: (.*?) https://srb\.help/(\d+)\s*$")

          def signatures(path):
              result = collections.Counter()
              with open(path, encoding="utf-8", errors="replace") as handle:
                  for raw in handle:
                      line = ansi.sub("", raw.rstrip("\n"))
                      match = error.match(line)
                      if match:
                          result[(match.group(1), match.group(2), match.group(3))] += 1
              return result

          baseline = signatures(sys.argv[1])
          candidate = signatures(sys.argv[2])
          if sum(baseline.values()) != 29:
              raise SystemExit(f"expected 29 overlay-store Sorbet errors, found {sum(baseline.values())}")
          if candidate != baseline:
              print("Sorbet signature delta from overlay-store:")
              for key, count in (candidate - baseline).items():
                  print("NEW", count, key)
              for key, count in (baseline - candidate).items():
                  print("MISSING", count, key)
              raise SystemExit(1)
          print("Sorbet baseline equivalence: PASS (29 pre-existing signatures, 0 new)")
          PY

      - name: Commit exact validated fixture fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "openai@example.invalid"
          git add \
            Library/Homebrew/test/overlay_spec.rb \
            Library/Homebrew/test/uninstall_spec.rb \
            Library/Homebrew/test/cmd/bundle/cleanup_subcommand_spec.rb \
            Library/Homebrew/test/formula_pin_spec.rb \
            Library/Homebrew/test/cmd/link_spec.rb
          git diff --cached --check
          git commit -m "Fix overlay validation regressions"
          git push origin HEAD:refs/heads/fix/overlay-review-hardening
