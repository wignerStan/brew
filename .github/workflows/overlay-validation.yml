name: Validate native overlay

on:
  pull_request:
    branches:
      - overlay-store
  push:
    branches:
      - 'fix/overlay-*'
      - 'refactor/overlay-*'

permissions:
  contents: read

concurrency:
  group: overlay-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  HOMEBREW_DEVELOPER: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch current Homebrew main as the comparison base
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Homebrew/brew.git 2>/dev/null ||
            git remote set-url upstream https://github.com/Homebrew/brew.git
          git fetch --no-tags --prune upstream \
            +refs/heads/main:refs/remotes/upstream/main

      - name: Check formatting, source syntax, and workflow safety
        shell: bash
        run: |
          set -euo pipefail
          git diff --check upstream/main...HEAD
          while IFS= read -r ruby_file; do
            [[ -n "${ruby_file}" ]] || continue
            ruby -c "${ruby_file}" >/dev/null
          done < <(git diff --name-only upstream/main...HEAD -- '*.rb' | sort)
          bash -n \
            bin/brew \
            Library/Homebrew/cmd/shellenv.sh \
            Library/Homebrew/utils/overlay.sh \
            Library/Homebrew/utils/overlay/core.sh
          while IFS= read -r test_script; do
            bash -n "${test_script}"
          done < <(find Library/Homebrew/test/support -maxdepth 1 -name 'overlay_*.sh' -print | sort)
          python3 -m py_compile \
            Library/Homebrew/test/support/overlay_style_delta_check.py \
            Library/Homebrew/test/support/overlay_style_delta_check_test.py
          python3 Library/Homebrew/test/support/overlay_style_delta_check_test.py
          bash Library/Homebrew/test/support/overlay_rebase_workflow_test.sh "$PWD"

      - name: Reject style offenses on overlay changes
        shell: bash
        run: |
          set -euo pipefail
          python3 Library/Homebrew/test/support/overlay_style_delta_check.py upstream/main HEAD

      - name: Run Sorbet
        shell: bash
        run: |
          set -euo pipefail
          bin/brew typecheck

      - name: Run complete overlay recovery matrix
        shell: bash
        run: |
          set -euo pipefail
          bash Library/Homebrew/test/support/overlay_final_review_reproducer.sh "$PWD"

      - name: Run full Homebrew RSpec suite
        shell: bash
        run: |
          set -euo pipefail
          bin/brew tests --no-parallel
