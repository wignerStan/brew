name: Validate native overlay

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'Library/Homebrew/**'
      - 'bin/brew'
      - 'docs/Native-User-Overlay*'
  push:
    branches:
      - fix/overlay-review-hardening

permissions:
  contents: read

env:
  CI: "1"
  HOMEBREW_DEVELOPER: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch comparison bases
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Homebrew/brew.git 2>/dev/null ||
            git remote set-url upstream https://github.com/Homebrew/brew.git
          git fetch --prune upstream main
          git branch -f main upstream/main

      - name: Check formatting and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --check upstream/main...HEAD
          bash -n bin/brew Library/Homebrew/utils/overlay.sh
          while IFS= read -r test_script; do
            bash -n "$test_script"
          done < <(find Library/Homebrew/test/support -maxdepth 1 -name 'overlay_*.sh' -print | sort)

      - name: Run complete overlay recovery matrix
        shell: bash
        run: |
          set -euo pipefail
          bash Library/Homebrew/test/support/overlay_final_review_reproducer.sh "$PWD"

      - name: Run full Homebrew RSpec suite
        shell: bash
        run: |
          set -euo pipefail
          bin/brew tests --no-parallel

      - name: Run RuboCop on overlay delta
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git diff --name-only --diff-filter=ACMR upstream/main...HEAD -- \
              '*.rb' '*.rbi' '*.sh' '*.yml' '*.yaml' bin/brew
          )
          if ((${#changed[@]} > 0)); then
            bin/brew style "${changed[@]}"
          fi

      - name: Run Sorbet
        shell: bash
        run: |
          set -euo pipefail
          bin/brew typecheck
