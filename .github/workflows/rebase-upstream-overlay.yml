name: Rebase and validate overlay branch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: rebase-overlay-branch
  cancel-in-progress: false

env:
  CI: "1"
  HOMEBREW_DEVELOPER: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  rebase-validate-promote:
    if: github.repository == 'wangzheng15534-blip/brew'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out the deployment branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: overlay-store
          fetch-depth: 0

      - name: Rebase onto current Homebrew main
        id: rebase
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Homebrew/brew.git 2>/dev/null ||
            git remote set-url upstream https://github.com/Homebrew/brew.git
          git fetch --prune origin overlay-store
          git fetch --prune upstream main

          before=$(git rev-parse origin/overlay-store)
          printf 'before=%s\n' "$before" >>"$GITHUB_OUTPUT"
          if ! git rebase upstream/main; then
            git rebase --abort || true
            echo "Upstream rebase has semantic conflicts; overlay-store was left unchanged." >&2
            exit 1
          fi
          git branch -f main upstream/main
          after=$(git rev-parse HEAD)
          printf 'after=%s\n' "$after" >>"$GITHUB_OUTPUT"
          if [[ "$before" == "$after" ]]; then
            printf 'changed=false\n' >>"$GITHUB_OUTPUT"
          else
            printf 'changed=true\n' >>"$GITHUB_OUTPUT"
          fi

      - name: Validate patch formatting and shell syntax
        if: steps.rebase.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check upstream/main...HEAD
          bash -n bin/brew Library/Homebrew/utils/overlay.sh
          while IFS= read -r test_script; do
            bash -n "$test_script"
          done < <(find Library/Homebrew/test/support -maxdepth 1 -name 'overlay_*.sh' -print | sort)

      - name: Run complete overlay recovery matrix
        if: steps.rebase.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash Library/Homebrew/test/support/overlay_final_review_reproducer.sh "$PWD"

      - name: Run full Homebrew RSpec suite
        if: steps.rebase.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bin/brew tests --no-parallel

      - name: Run RuboCop on the rebased overlay delta
        if: steps.rebase.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git diff --name-only --diff-filter=ACMR upstream/main...HEAD -- \
              '*.rb' '*.rbi' '*.sh' '*.yml' '*.yaml' bin/brew
          )
          if ((${#changed[@]} > 0)); then
            bin/brew style "${changed[@]}"
          fi

      - name: Run Sorbet
        if: steps.rebase.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bin/brew typecheck

      - name: Publish tested candidate
        if: steps.rebase.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:refs/heads/automation/overlay-rebase-candidate

      - name: Promote the exact tested SHA
        if: steps.rebase.outputs.changed == 'true'
        shell: bash
        env:
          BEFORE: ${{ steps.rebase.outputs.before }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.rebase.outputs.after }}"
          git push \
            --force-with-lease=refs/heads/overlay-store:${BEFORE} \
            origin HEAD:refs/heads/overlay-store
