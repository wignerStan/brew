name: Repair deprecated overlay path resolution

on:
  push:
    branches:
      - automation/refactor-overlay-pathname-repair-v9-20260913
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-overlay-pathname-resolution-v9
  cancel-in-progress: false

env:
  CI: "1"
  HOMEBREW_DEVELOPER: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  CANDIDATE_BRANCH: automation/refactor-overlay-rebased-candidate-20260913
  CANDIDATE_BEFORE: d7e36f5e161f0802d71ec62f178c41e50f9525ce
  UPSTREAM_SHA: 06cc13226bd21a04faf2aba01d4a3e4836257ce8

jobs:
  repair:
    if: github.repository == 'wignerStan/brew'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: automation/refactor-overlay-rebased-candidate-20260913
          fetch-depth: 0
          persist-credentials: true

      - name: Replace the deprecated Pathname extension and add a regression guard
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin

          test "$(git rev-parse HEAD)" = "${CANDIDATE_BEFORE}"
          test "$(git rev-parse HEAD^^)" = "${UPSTREAM_SHA}"

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "Library/Homebrew/overlay/core.rb",
              'require "utils/popen"\n',
              'require "utils/path"\nrequire "utils/popen"\n',
          )
          replace_once(
              "Library/Homebrew/overlay/core.rb",
              "      return path.resolved_path unless inherited_prefix_link?(path)\n",
              "      return Utils::Path.resolved_path(path) unless inherited_prefix_link?(path)\n",
          )
          replace_once(
              "Library/Homebrew/test/support/overlay_architecture_test.sh",
              "        reinstall_adapter=\"${repo}/Library/Homebrew/reinstall/reinstall.rb\"\n\n",
              "        reinstall_adapter=\"${repo}/Library/Homebrew/reinstall/reinstall.rb\"\n\n"
              "        if grep -R -n -F '.resolved_path' \"${ruby_impl}\" |\n"
              "           grep -v -F 'Utils::Path.resolved_path'\n"
              "        then\n"
              "          echo \"Error: overlay implementation uses deprecated Pathname#resolved_path\" >&2\n"
              "          exit 1\n"
              "        fi\n\n",
          )
          PY

          if grep -R -n -F '.resolved_path' Library/Homebrew/overlay |
             grep -v -F 'Utils::Path.resolved_path'
          then
            echo "Error: overlay implementation still uses deprecated Pathname#resolved_path" >&2
            exit 1
          fi
          git diff --check
          ruby -c Library/Homebrew/overlay/core.rb >/dev/null
          bash -n Library/Homebrew/test/support/overlay_architecture_test.sh
          bash Library/Homebrew/test/support/overlay_architecture_test.sh "$PWD"
          bash Library/Homebrew/test/support/overlay_final_review_reproducer.sh "$PWD"

      - name: Commit and safely advance the candidate branch
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false
          git config core.hooksPath /dev/null
          git add \
            Library/Homebrew/overlay/core.rb \
            Library/Homebrew/test/support/overlay_architecture_test.sh
          git commit -m "Use supported overlay path resolution"

          after="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          test "$(git rev-parse HEAD^)" = "${CANDIDATE_BEFORE}"
          test "$(git rev-parse HEAD^^^)" = "${UPSTREAM_SHA}"
          test -z "$(git status --porcelain)"
          printf 'after=%s\n' "${after}" >>"${GITHUB_OUTPUT}"
          printf 'tree=%s\n' "${tree}" >>"${GITHUB_OUTPUT}"

          git push \
            --force-with-lease="refs/heads/${CANDIDATE_BRANCH}:${CANDIDATE_BEFORE}" \
            origin "${after}:refs/heads/${CANDIDATE_BRANCH}"

      - name: Report repaired candidate identity
        shell: bash
        env:
          AFTER: ${{ steps.candidate.outputs.after }}
          TREE: ${{ steps.candidate.outputs.tree }}
        run: |
          set -euo pipefail
          printf 'Repaired candidate: %s\n' "${AFTER}"
          printf 'Repaired tree: %s\n' "${TREE}"
