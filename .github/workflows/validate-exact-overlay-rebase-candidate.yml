name: Validate exact upstream-rooted overlay candidate

on:
  push:
    branches:
      - automation/refactor-overlay-validation-v5-20260913
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-exact-overlay-rebase-candidate
  cancel-in-progress: false

env:
  CI: "1"
  HOMEBREW_DEVELOPER: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  CANDIDATE_SHA: ec323fcb9081e87382d40d2c164a581d9ee2b547
  CANDIDATE_TREE: 4e2a79676e42b34735c70682dae9fcd0361bff7d
  CANDIDATE_BRANCH: automation/refactor-overlay-rebased-candidate-20260913
  UPSTREAM_SHA: 06cc13226bd21a04faf2aba01d4a3e4836257ce8
  TARGET_BRANCH: refactor/overlay-maintainability
  TARGET_BEFORE: d986308aaef0c7dd1a0a669b25fdd94723e28c2f

jobs:
  validate:
    if: github.repository == 'wignerStan/brew'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the exact candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ec323fcb9081e87382d40d2c164a581d9ee2b547
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable candidate, upstream parent, and target lease
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin

          git fetch --no-tags --prune origin \
            "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/candidate" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/target"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${CANDIDATE_TREE}"
          test "$(git rev-parse HEAD^)" = "${UPSTREAM_SHA}"
          test "$(git rev-parse refs/remotes/origin/candidate)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse refs/remotes/origin/target)" = "${TARGET_BEFORE}"
          test -z "$(git rev-list --merges "${UPSTREAM_SHA}..${CANDIDATE_SHA}")"

      - name: Validate formatting, syntax, and workflow safety
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${UPSTREAM_SHA}...HEAD"
          bash -n \
            bin/brew \
            Library/Homebrew/cmd/shellenv.sh \
            Library/Homebrew/utils/overlay.sh \
            Library/Homebrew/utils/overlay/core.sh
          while IFS= read -r test_script; do
            bash -n "${test_script}"
          done < <(find Library/Homebrew/test/support -maxdepth 1 -name 'overlay_*.sh' -print | sort)
          python3 -m py_compile \
            Library/Homebrew/test/support/overlay_style_delta_check.py \
            Library/Homebrew/test/support/overlay_style_delta_check_test.py
          python3 Library/Homebrew/test/support/overlay_style_delta_check_test.py
          bash Library/Homebrew/test/support/overlay_rebase_workflow_test.sh "$PWD"

      - name: Run complete overlay recovery matrix
        shell: bash
        run: |
          set -euo pipefail
          bash Library/Homebrew/test/support/overlay_final_review_reproducer.sh "$PWD"

      - name: Run full Homebrew RSpec suite
        shell: bash
        run: |
          set -euo pipefail
          bin/brew tests --no-parallel

      - name: Reject style offenses in the rebased overlay delta
        shell: bash
        run: |
          set -euo pipefail
          python3 Library/Homebrew/test/support/overlay_style_delta_check.py "${UPSTREAM_SHA}" HEAD

      - name: Run Sorbet
        shell: bash
        run: |
          set -euo pipefail
          bin/brew typecheck

      - name: Attest the exact validated commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${CANDIDATE_TREE}"
          test "$(git rev-parse HEAD^)" = "${UPSTREAM_SHA}"
          printf 'Validated candidate: %s\n' "${CANDIDATE_SHA}"
          printf 'Validated tree: %s\n' "${CANDIDATE_TREE}"
