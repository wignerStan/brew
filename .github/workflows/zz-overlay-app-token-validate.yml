name: Validate short-lived overlay promotion configuration

on:
  push:
    branches:
      - automation/overlay-app-token-hardening

permissions:
  contents: read

env:
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_DEVELOPER: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact workflow candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: automation/overlay-app-token-hardening
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the promotion architecture and source delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base 87262ba9eca4ce4889784338136bb0e3b1105d03 HEAD)" = \
            87262ba9eca4ce4889784338136bb0e3b1105d03
          git diff --check 87262ba9eca4ce4889784338136bb0e3b1105d03...HEAD
          bash -n Library/Homebrew/test/support/overlay_rebase_workflow_test.sh
          bash Library/Homebrew/test/support/overlay_rebase_workflow_test.sh "$PWD"
          bin/brew style --display-cop-names \
            .github/workflows/rebase-upstream-overlay.yml \
            Library/Homebrew/test/support/overlay_rebase_workflow_test.sh \
            docs/Overlay-Promotion-Credentials.md
