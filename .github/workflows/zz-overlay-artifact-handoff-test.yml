name: Test overlay candidate artifact handoff

on:
  push:
    branches:
      - automation/overlay-hardening-finalize

permissions: {}

jobs:
  prepare:
    if: github.event.head_commit.message == 'Test overlay candidate artifact handoff'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      before: ${{ steps.bundle.outputs.before }}
      after: ${{ steps.bundle.outputs.after }}
      tree: ${{ steps.bundle.outputs.tree }}
      sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - name: Check out the final candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 92d49c3894670fbe0058ff9d584628b335408cd7
          fetch-depth: 0
          persist-credentials: false

      - name: Create a thin exact-SHA bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin
          before=1d5e658cf64d402c7b531f5f8447181d740e03a4
          after=92d49c3894670fbe0058ff9d584628b335408cd7
          tree="$(/usr/bin/git rev-parse 'HEAD^{tree}')"
          test "$(/usr/bin/git rev-parse HEAD)" = "${after}"
          /usr/bin/git merge-base --is-ancestor "${before}" "${after}"

          bundle_dir="${RUNNER_TEMP}/overlay-artifact-handoff-test"
          /usr/bin/install -d -m 0700 "${bundle_dir}"
          bundle="${bundle_dir}/candidate.bundle"
          ref=refs/overlay-bundle/candidate
          /usr/bin/git update-ref "${ref}" "${after}"
          trap '/usr/bin/git update-ref -d refs/overlay-bundle/candidate' EXIT
          /usr/bin/git bundle create "${bundle}" "${ref}" "^${before}"
          /usr/bin/git bundle verify "${bundle}"
          sha256="$(/usr/bin/sha256sum "${bundle}" | /usr/bin/awk '{print $1}')"

          printf 'before=%s\n' "${before}" >>"${GITHUB_OUTPUT}"
          printf 'after=%s\n' "${after}" >>"${GITHUB_OUTPUT}"
          printf 'tree=%s\n' "${tree}" >>"${GITHUB_OUTPUT}"
          printf 'sha256=%s\n' "${sha256}" >>"${GITHUB_OUTPUT}"

      - name: Upload the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overlay-artifact-handoff-test
          path: ${{ runner.temp }}/overlay-artifact-handoff-test/candidate.bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  validate:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact bundle prerequisite
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.before }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the bundle on a fresh runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: overlay-artifact-handoff-test
          path: ${{ runner.temp }}/overlay-artifact-handoff-test

      - name: Verify and import the exact candidate
        shell: bash
        env:
          AFTER: ${{ needs.prepare.outputs.after }}
          EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
          BUNDLE_SHA256: ${{ needs.prepare.outputs.sha256 }}
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin
          bundle="${RUNNER_TEMP}/overlay-artifact-handoff-test/candidate.bundle"
          test "$(/usr/bin/sha256sum "${bundle}" | /usr/bin/awk '{print $1}')" = "${BUNDLE_SHA256}"
          /usr/bin/git config core.hooksPath /dev/null
          /usr/bin/git bundle verify "${bundle}"
          refs="$(/usr/bin/git bundle unbundle "${bundle}")"
          sha="$(
            printf '%s\n' "${refs}" |
              /usr/bin/awk '$2 == "refs/overlay-bundle/candidate" { print $1 }'
          )"
          test "${sha}" = "${AFTER}"
          /usr/bin/git checkout --detach "${AFTER}"
          test "$(/usr/bin/git rev-parse 'HEAD^{tree}')" = "${EXPECTED_TREE}"
