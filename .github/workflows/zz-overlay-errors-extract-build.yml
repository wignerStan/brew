name: Build overlay error-boundary extraction

on:
  push:
    branches:
      - automation/overlay-pr-errors-extract-build

permissions: {}

jobs:
  build:
    if: github.event.head_commit.message == 'Build overlay error-boundary extraction'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.bundle.outputs.base_sha }}
      candidate_sha: ${{ steps.bundle.outputs.candidate_sha }}
      candidate_tree: ${{ steps.bundle.outputs.candidate_tree }}
      bundle_sha256: ${{ steps.bundle.outputs.bundle_sha256 }}
    steps:
      - name: Check out the current PR head without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/overlay-hardening-maintainability
          fetch-depth: 0
          persist-credentials: false

      - name: Extract stable overlay error types
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_TEMPLATE_DIR="$(mktemp -d)"
          git config core.hooksPath /dev/null

          python3 <<'PY'
          from pathlib import Path
          import re

          core_path = Path("Library/Homebrew/overlay/core.rb")
          core = core_path.read_text(encoding="utf-8")

          inherited = re.search(
              r"    class InheritedKegError < RuntimeError\n.*?\n    end\n\n(?=    class TransactionFailure)",
              core,
              re.DOTALL,
          )
          transaction = re.search(
              r"    class TransactionFailure < RuntimeError; end\n\n",
              core,
          )
          generation = re.search(
              r"    class BaseGenerationChangedError < TransactionFailure\n.*?\n    end\n\n(?=    #)",
              core,
              re.DOTALL,
          )
          if not inherited or not transaction or not generation:
              raise SystemExit("overlay error class layout changed")

          spans = [inherited.span(), transaction.span(), generation.span()]
          for left, right in zip(spans, spans[1:]):
              if left[1] != right[0]:
                  raise SystemExit("unexpected content between overlay error classes")

          classes = core[inherited.start():generation.end()].rstrip()
          errors = (
              "# typed: strict\n"
              "# frozen_string_literal: true\n\n"
              "module Homebrew\n"
              "  module Overlay\n"
              f"{classes}\n"
              "  end\n"
              "end\n"
          )
          errors_path = Path("Library/Homebrew/overlay/errors.rb")
          if errors_path.exists():
              raise SystemExit("overlay/errors.rb already exists")
          errors_path.write_text(errors, encoding="utf-8")

          core = core[:inherited.start()] + core[generation.end():]
          require_anchor = '# frozen_string_literal: true\n\n'
          if core.count(require_anchor) != 1:
              raise SystemExit("core require anchor changed")
          core = core.replace(
              require_anchor,
              require_anchor + 'require "overlay/errors"\n\n',
              1,
          )
          core_path.write_text(core, encoding="utf-8")

          readme_path = Path("Library/Homebrew/overlay/README.md")
          readme = readme_path.read_text(encoding="utf-8")
          anchor = "## Current extraction state\n\n"
          if readme.count(anchor) != 1:
              raise SystemExit("overlay README extraction anchor changed")
          readme = readme.replace(
              anchor,
              anchor
              + "- `errors.rb` owns the stable public exception hierarchy used by all lower layers.\n",
              1,
          )
          readme_path.write_text(readme, encoding="utf-8")
          PY

          git diff --check
          mapfile -t paths < <(git diff --name-only)
          expected=(
            Library/Homebrew/overlay/README.md
            Library/Homebrew/overlay/core.rb
            Library/Homebrew/overlay/errors.rb
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"
          do
            test "${paths[$i]}" = "${expected[$i]}"
          done

          grep -Fq 'require "overlay/errors"' Library/Homebrew/overlay/core.rb
          if grep -Eq '^    class (InheritedKegError|TransactionFailure|BaseGenerationChangedError)' \
            Library/Homebrew/overlay/core.rb
          then
            echo 'error definitions remain in overlay/core.rb' >&2
            exit 1
          fi
          grep -Fq 'class InheritedKegError < RuntimeError' Library/Homebrew/overlay/errors.rb
          grep -Fq 'class TransactionFailure < RuntimeError; end' Library/Homebrew/overlay/errors.rb
          grep -Fq 'class BaseGenerationChangedError < TransactionFailure' Library/Homebrew/overlay/errors.rb
          if grep -Eq 'require "(formula_installer|keg|install|cmd/|dev-cmd/)' Library/Homebrew/overlay/errors.rb
          then
            echo 'low-level overlay errors depend on a higher layer' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${expected[@]}"
          git commit -m 'Extract the overlay error boundary'

      - name: Validate the exact structural candidate
        shell: bash
        env:
          CI: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
          HOMEBREW_DEVELOPER: "1"
        run: |
          set -euo pipefail
          git diff --check HEAD^
          ruby -c Library/Homebrew/overlay/errors.rb >/dev/null
          ruby -c Library/Homebrew/overlay/core.rb >/dev/null
          bin/brew style --display-cop-names \
            Library/Homebrew/overlay/errors.rb \
            Library/Homebrew/overlay/core.rb
          bin/brew typecheck
          bin/brew tests --no-parallel \
            --only=overlay/core,overlay/install_session,overlay/reinstall_session,overlay/reinstall_backup,formula_installer
          bash Library/Homebrew/test/support/overlay_final_review_reproducer.sh "$PWD"
          bin/brew tests --no-parallel

      - name: Create immutable candidate bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD^)"
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse 'HEAD^{tree}')"
          bundle_dir="${RUNNER_TEMP}/overlay-errors-candidate"
          install -d -m 0700 "${bundle_dir}"
          bundle="${bundle_dir}/candidate.bundle"
          git update-ref refs/overlay-builder/candidate "${candidate_sha}"
          trap 'git update-ref -d refs/overlay-builder/candidate' EXIT
          git bundle create "${bundle}" refs/overlay-builder/candidate "^${base_sha}"
          git bundle verify "${bundle}"
          bundle_sha256="$(sha256sum "${bundle}" | awk '{print $1}')"
          printf 'base_sha=%s\n' "${base_sha}" >>"${GITHUB_OUTPUT}"
          printf 'candidate_sha=%s\n' "${candidate_sha}" >>"${GITHUB_OUTPUT}"
          printf 'candidate_tree=%s\n' "${candidate_tree}" >>"${GITHUB_OUTPUT}"
          printf 'bundle_sha256=%s\n' "${bundle_sha256}" >>"${GITHUB_OUTPUT}"

      - name: Upload validated candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overlay-errors-candidate
          path: ${{ runner.temp }}/overlay-errors-candidate/candidate.bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download validated candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: overlay-errors-candidate
          path: ${{ runner.temp }}/overlay-errors-candidate

      - name: Publish only the verified commit
        shell: bash
        env:
          BASE_SHA: ${{ needs.build.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.build.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ needs.build.outputs.candidate_tree }}
          BUNDLE_SHA256: ${{ needs.build.outputs.bundle_sha256 }}
          FINAL_BRANCH: fix/overlay-hardening-maintainability
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin
          isolated_home="$(mktemp -d)"
          repository="$(mktemp -d)"
          askpass="$(mktemp)"
          trap 'rm -rf "${isolated_home}" "${repository}"; rm -f "${askpass}"' EXIT
          export HOME="${isolated_home}"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_TEMPLATE_DIR="$(mktemp -d)"

          cat >"${askpass}" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *) printf '%s\n' "${PUSH_TOKEN:?}" ;;
          esac
          ASKPASS
          chmod 0700 "${askpass}"

          bundle="${RUNNER_TEMP}/overlay-errors-candidate/candidate.bundle"
          test "$(sha256sum "${bundle}" | awk '{print $1}')" = "${BUNDLE_SHA256}"
          git init -q "${repository}"
          git -C "${repository}" config core.hooksPath /dev/null
          git -C "${repository}" config transfer.fsckObjects true
          git -C "${repository}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git -C "${repository}" fetch --no-tags origin \
              "+refs/heads/${FINAL_BRANCH}:refs/remotes/origin/final"
          test "$(git -C "${repository}" rev-parse refs/remotes/origin/final)" = "${BASE_SHA}"
          git -C "${repository}" bundle verify "${bundle}"
          bundle_refs="$(git -C "${repository}" bundle unbundle "${bundle}")"
          bundle_sha="$(printf '%s\n' "${bundle_refs}" | awk '$2 == "refs/overlay-builder/candidate" { print $1 }')"
          test "${bundle_sha}" = "${CANDIDATE_SHA}"
          test "$(git -C "${repository}" rev-parse "${CANDIDATE_SHA}^{tree}")" = "${CANDIDATE_TREE}"
          test "$(git -C "${repository}" rev-list --count "${BASE_SHA}..${CANDIDATE_SHA}")" -eq 1
          test -z "$(git -C "${repository}" rev-list --merges "${BASE_SHA}..${CANDIDATE_SHA}")"

          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git -C "${repository}" push \
              --force-with-lease="refs/heads/${FINAL_BRANCH}:${BASE_SHA}" \
              origin "${CANDIDATE_SHA}:refs/heads/${FINAL_BRANCH}"
