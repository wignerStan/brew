name: Fix final overlay helper

on:
  push:
    branches:
      - refactor/overlay-maintainability

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Fix final overlay helper'
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refactor/overlay-maintainability
          fetch-depth: 0

      - name: Remove generated leading blank line and reactivate validation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/zz-overlay-install-session-final.yml")
          source = path.read_text(encoding="utf-8")
          old = '          replacement = "\\n" + indent(\n'
          new = '          replacement = indent(\n'
          if source.count(old) != 1:
              raise SystemExit(f"expected one formula-spec prefix, found {source.count(old)}")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY

          git rm .github/workflows/zz-overlay-fix-final-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/zz-overlay-install-session-final.yml
          git commit -m "Run final overlay install session validation"
          git push origin HEAD:refactor/overlay-maintainability
