name: Debug overlay hardening round 2

on:
  push:
    branches:
      - automation/overlay-hardening-round2

permissions:
  contents: write

jobs:
  debug:
    if: github.event.head_commit.message == 'Debug overlay hardening round 2'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out the hardening build branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: automation/overlay-hardening-round2
          fetch-depth: 0

      - name: Reproduce the focused recovery failure with tracing
        shell: bash
        run: |
          set -euo pipefail
          cp .github/hardening-payload/generate.sh /tmp/overlay-hardening-round2.sh
          sed -i 's#^bash Library/Homebrew/test/support/overlay_reinstall_recovery_test.sh#bash -x Library/Homebrew/test/support/overlay_reinstall_recovery_test.sh#' /tmp/overlay-hardening-round2.sh
          chmod 0700 /tmp/overlay-hardening-round2.sh
          bash /tmp/overlay-hardening-round2.sh
