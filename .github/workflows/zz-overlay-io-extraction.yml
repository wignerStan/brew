name: Extract overlay I/O boundaries

on:
  push:
    branches:
      - automation/overlay-io-extraction

permissions: {}

env:
  CI: "1"
  HOMEBREW_DEVELOPER: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.bundle.outputs.candidate_sha }}
      candidate_tree: ${{ steps.bundle.outputs.candidate_tree }}
      bundle_sha256: ${{ steps.bundle.outputs.bundle_sha256 }}
    steps:
      - name: Check out the exact builder source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate the transformation and reset to the reviewed PR head
        shell: bash
        env:
          BASE_SHA: 011ccfad6cae49f30237af00e8506cf39dacb272
        run: |
          set -euo pipefail
          source_root="${RUNNER_TEMP}/overlay-io-extraction-source"
          install -d -m 0700 "${source_root}"
          install -m 0600 .github/scripts/extract_overlay_io_boundaries.py "${source_root}/"
          python3 -m py_compile "${source_root}/extract_overlay_io_boundaries.py"
          git checkout --detach "${BASE_SHA}"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath /dev/null
          python3 "${source_root}/extract_overlay_io_boundaries.py"

      - name: Validate topology, syntax, style, and architecture
        shell: bash
        env:
          BASE_SHA: 011ccfad6cae49f30237af00e8506cf39dacb272
          OVERLAY_STORE_SHA: 2b0f7e28d76e2d51fb75e28f0bc71f00dabd4a5c
        run: |
          set -euo pipefail
          test "$(git rev-list --count "${BASE_SHA}..HEAD")" -eq 2
          test -z "$(git rev-list --merges "${BASE_SHA}..HEAD")"
          test -z "$(git status --porcelain)"
          test -z "$(git diff --name-only "${BASE_SHA}...HEAD" -- .github)"
          git diff --check "${BASE_SHA}...HEAD"
          ruby -c Library/Homebrew/overlay.rb >/dev/null
          ruby -c Library/Homebrew/overlay/core.rb >/dev/null
          ruby -c Library/Homebrew/overlay/owned_io.rb >/dev/null
          ruby -c Library/Homebrew/overlay/durable_fs.rb >/dev/null
          ruby -c Library/Homebrew/test/overlay/owned_io_spec.rb >/dev/null
          ruby -c Library/Homebrew/test/overlay/durable_fs_spec.rb >/dev/null
          bash -n Library/Homebrew/test/support/overlay_architecture_test.sh
          python3 -m py_compile Library/Homebrew/test/support/overlay_style_delta_check.py
          python3 Library/Homebrew/test/support/overlay_style_delta_check.py "${OVERLAY_STORE_SHA}" HEAD
          bash Library/Homebrew/test/support/overlay_architecture_test.sh "$PWD"

      - name: Run Sorbet and focused ownership-boundary specs
        shell: bash
        run: |
          set -euo pipefail
          bin/brew typecheck
          bin/brew tests --no-parallel \
            --only=overlay/core,overlay/owned_io,overlay/durable_fs,overlay/install_session,overlay/reinstall_session,overlay/reinstall_backup,formula_installer

      - name: Run the complete overlay recovery matrix
        shell: bash
        run: |
          set -euo pipefail
          bash Library/Homebrew/test/support/overlay_final_review_reproducer.sh "$PWD"

      - name: Run the full Homebrew RSpec suite
        shell: bash
        run: |
          set -euo pipefail
          bin/brew tests --no-parallel

      - name: Create an immutable source-only candidate bundle
        id: bundle
        shell: bash
        env:
          BASE_SHA: 011ccfad6cae49f30237af00e8506cf39dacb272
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse 'HEAD^{tree}')"
          bundle_dir="${RUNNER_TEMP}/overlay-io-extraction"
          install -d -m 0700 "${bundle_dir}"
          bundle="${bundle_dir}/candidate.bundle"
          git update-ref refs/overlay-builder/candidate "${candidate_sha}"
          trap 'git update-ref -d refs/overlay-builder/candidate' EXIT
          git bundle create "${bundle}" refs/overlay-builder/candidate "^${BASE_SHA}"
          git bundle verify "${bundle}"
          bundle_sha256="$(sha256sum "${bundle}" | awk '{print $1}')"
          test "${#candidate_sha}" -eq 40
          test "${#candidate_tree}" -eq 40
          test "${#bundle_sha256}" -eq 64
          printf 'candidate_sha=%s\n' "${candidate_sha}" >>"${GITHUB_OUTPUT}"
          printf 'candidate_tree=%s\n' "${candidate_tree}" >>"${GITHUB_OUTPUT}"
          printf 'bundle_sha256=%s\n' "${bundle_sha256}" >>"${GITHUB_OUTPUT}"

      - name: Upload the validated candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overlay-io-extraction
          path: ${{ runner.temp }}/overlay-io-extraction/candidate.bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download the validated source bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: overlay-io-extraction
          path: ${{ runner.temp }}/overlay-io-extraction

      - name: Verify and fast-forward the PR branch
        shell: bash
        env:
          BASE_SHA: 011ccfad6cae49f30237af00e8506cf39dacb272
          CANDIDATE_SHA: ${{ needs.build.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ needs.build.outputs.candidate_tree }}
          BUNDLE_SHA256: ${{ needs.build.outputs.bundle_sha256 }}
          FINAL_BRANCH: fix/overlay-pr-clean
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin
          isolated_home="$(mktemp -d)"
          repository="$(mktemp -d)"
          askpass="$(mktemp)"
          trap 'rm -rf "${isolated_home}" "${repository}"; rm -f "${askpass}"' EXIT
          export HOME="${isolated_home}"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null

          cat >"${askpass}" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *) printf '%s\n' "${PUSH_TOKEN:?}" ;;
          esac
          ASKPASS
          chmod 0700 "${askpass}"

          bundle="${RUNNER_TEMP}/overlay-io-extraction/candidate.bundle"
          test "$(sha256sum "${bundle}" | awk '{print $1}')" = "${BUNDLE_SHA256}"
          git init -q "${repository}"
          git -C "${repository}" config core.hooksPath /dev/null
          git -C "${repository}" config transfer.fsckObjects true
          git -C "${repository}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git -C "${repository}" fetch --no-tags origin \
              "+refs/heads/${FINAL_BRANCH}:refs/remotes/origin/final"
          test "$(git -C "${repository}" rev-parse refs/remotes/origin/final)" = "${BASE_SHA}"
          git -C "${repository}" bundle verify "${bundle}"
          bundle_refs="$(git -C "${repository}" bundle unbundle "${bundle}")"
          bundle_sha="$(printf '%s\n' "${bundle_refs}" | awk '$2 == "refs/overlay-builder/candidate" { print $1 }')"
          test "${bundle_sha}" = "${CANDIDATE_SHA}"
          test "$(git -C "${repository}" rev-parse "${CANDIDATE_SHA}^{tree}")" = "${CANDIDATE_TREE}"
          test "$(git -C "${repository}" rev-list --count "${BASE_SHA}..${CANDIDATE_SHA}")" -eq 2
          test -z "$(git -C "${repository}" rev-list --merges "${BASE_SHA}..${CANDIDATE_SHA}")"
          test -z "$(git -C "${repository}" diff --name-only "${BASE_SHA}...${CANDIDATE_SHA}" -- .github)"

          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git -C "${repository}" push \
              --force-with-lease="refs/heads/${FINAL_BRANCH}:${BASE_SHA}" \
              origin "${CANDIDATE_SHA}:refs/heads/${FINAL_BRANCH}"
