name: Inspect residual overlay style debt

on:
  push:
    branches:
      - automation/overlay-pr-clean-build

permissions:
  contents: read

env:
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_DEVELOPER: "1"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the verified Ruby-normalized candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 87262ba9eca4ce4889784338136bb0e3b1105d03
          fetch-depth: 0
          persist-credentials: false

      - name: Report all residual style diagnostics
        shell: bash
        run: |
          set -o pipefail
          bin/brew style --display-cop-names \
            Library/Homebrew/overlay/core.rb \
            Library/Homebrew/utils/overlay/core.sh \
            Library/Homebrew/test/support/overlay_style_delta_check.py
