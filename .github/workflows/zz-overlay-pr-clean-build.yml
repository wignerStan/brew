name: Build overlay maintainability hardening

on:
  push:
    branches:
      - automation/overlay-pr-clean-build

permissions: {}

env:
  CI: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_DEVELOPER: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      patch_sha256: ${{ steps.patch.outputs.sha256 }}
      result_tree: ${{ steps.patch.outputs.tree }}
    steps:
      - name: Check out the transformation source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: automation/overlay-pr-clean-build
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate the transformation and reset to the reviewed base
        shell: bash
        run: |
          set -euo pipefail
          source_root="${RUNNER_TEMP}/overlay-pr-clean-source"
          install -d -m 0700 "${source_root}/.github/scripts"
          install -m 0600 \
            .github/scripts/build_overlay_pr_cleanup.py \
            .github/scripts/patch_overlay_pr_cleanup_builder.py \
            .github/scripts/fix_overlay_reader_builder.py \
            "${source_root}/.github/scripts/"
          (
            cd "${source_root}"
            python3 .github/scripts/patch_overlay_pr_cleanup_builder.py
            python3 .github/scripts/fix_overlay_reader_builder.py
          )
          git checkout --detach 87262ba9eca4ce4889784338136bb0e3b1105d03
          git clean -ffdx
          test "$(git rev-parse HEAD)" = 87262ba9eca4ce4889784338136bb0e3b1105d03

      - name: Apply the reviewed maintainability and durability transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/overlay-pr-clean-source/.github/scripts/build_overlay_pr_cleanup.py"
          git diff --check
          if git diff --diff-filter=D --name-only | grep -q .; then
            echo "hardening transformation unexpectedly deleted a tracked file" >&2
            exit 1
          fi

      - name: Normalize only the explicitly changed Ruby and shell files
        shell: bash
        run: |
          set -euo pipefail
          bin/brew style --fix \
            Library/Homebrew/overlay/core.rb \
            Library/Homebrew/test/overlay/core_spec.rb \
            Library/Homebrew/utils/overlay/core.sh \
            Library/Homebrew/test/support/overlay_directory_durability_test.sh \
            Library/Homebrew/test/support/overlay_final_review_reproducer.sh || true
          if git diff --diff-filter=D --name-only | grep -q .; then
            echo "formatter unexpectedly deleted a tracked file" >&2
            exit 1
          fi
          git diff --check

      - name: Validate syntax, full style, and fail-closed parser coverage
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            Library/Homebrew/utils/overlay.sh \
            Library/Homebrew/utils/overlay/core.sh \
            Library/Homebrew/test/support/overlay_directory_durability_test.sh \
            Library/Homebrew/test/support/overlay_final_review_reproducer.sh
          ruby -c Library/Homebrew/overlay/core.rb >/dev/null
          ruby -c Library/Homebrew/test/overlay/core_spec.rb >/dev/null
          python3 -m py_compile \
            Library/Homebrew/test/support/overlay_style_delta_check.py \
            Library/Homebrew/test/support/overlay_style_delta_check_test.py
          python3 Library/Homebrew/test/support/overlay_style_delta_check_test.py
          bin/brew style --display-cop-names \
            Library/Homebrew/overlay/core.rb \
            Library/Homebrew/test/overlay/core_spec.rb \
            Library/Homebrew/utils/overlay/core.sh \
            Library/Homebrew/test/support/overlay_directory_durability_test.sh \
            Library/Homebrew/test/support/overlay_final_review_reproducer.sh

      - name: Run Sorbet and focused regression coverage
        shell: bash
        run: |
          set -euo pipefail
          bin/brew typecheck
          bin/brew tests --no-parallel \
            --only=overlay/core,overlay/install_session,overlay/reinstall_session,overlay/reinstall_backup,formula_installer

      - name: Run the complete overlay recovery matrix
        shell: bash
        run: |
          set -euo pipefail
          bash Library/Homebrew/test/support/overlay_final_review_reproducer.sh "$PWD"

      - name: Run the full Homebrew RSpec suite
        shell: bash
        run: |
          set -euo pipefail
          bin/brew tests --no-parallel

      - name: Package the exact source-only patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          patch="${RUNNER_TEMP}/overlay-maintainability-hardening.patch"
          index="${RUNNER_TEMP}/overlay-maintainability-hardening.index"
          rm -f "${index}"
          GIT_INDEX_FILE="${index}" git read-tree HEAD
          GIT_INDEX_FILE="${index}" git add -A -- Library/Homebrew
          GIT_INDEX_FILE="${index}" git diff --cached --binary HEAD -- Library/Homebrew >"${patch}"
          test -s "${patch}"
          python3 - "${patch}" <<'PY'
          import pathlib
          import re
          import sys

          patch = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          paths = re.findall(r"^diff --git a/(.+?) b/(.+?)$", patch, re.MULTILINE)
          if not paths:
              raise SystemExit("hardening patch has no changed paths")
          allowed = {
              "Library/Homebrew/overlay/core.rb",
              "Library/Homebrew/test/overlay/core_spec.rb",
              "Library/Homebrew/test/support/overlay_directory_durability_test.sh",
              "Library/Homebrew/test/support/overlay_final_review_reproducer.sh",
              "Library/Homebrew/test/support/overlay_style_delta_check.py",
              "Library/Homebrew/test/support/overlay_style_delta_check_test.py",
              "Library/Homebrew/utils/overlay/core.sh",
          }
          for old, new in paths:
              if old != new or old not in allowed:
                  raise SystemExit(f"unexpected hardening patch path: {old} -> {new}")
          missing = allowed.difference(path for path, _ in paths)
          if missing:
              raise SystemExit(f"hardening patch omitted expected paths: {sorted(missing)}")
          PY
          sha256="$(sha256sum "${patch}" | awk '{print $1}')"
          tree="$(GIT_INDEX_FILE="${index}" git write-tree)"
          test "${#sha256}" -eq 64
          test "${#tree}" -eq 40
          printf 'sha256=%s\n' "${sha256}" >>"${GITHUB_OUTPUT}"
          printf 'tree=%s\n' "${tree}" >>"${GITHUB_OUTPUT}"

      - name: Upload the verified hardening patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overlay-maintainability-hardening
          path: ${{ runner.temp }}/overlay-maintainability-hardening.patch
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the exact publication branch without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: automation/overlay-maintainability-hardening-result
          fetch-depth: 0
          persist-credentials: false

      - name: Download the exact verified source patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: overlay-maintainability-hardening
          path: ${{ runner.temp }}/overlay-maintainability-hardening

      - name: Verify, commit, and publish the exact patch
        shell: bash
        env:
          EXPECTED_BASE: 87262ba9eca4ce4889784338136bb0e3b1105d03
          EXPECTED_PATCH_SHA256: ${{ needs.build.outputs.patch_sha256 }}
          EXPECTED_TREE: ${{ needs.build.outputs.result_tree }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin
          test "$(git rev-parse HEAD)" = "${EXPECTED_BASE}"
          patch="${RUNNER_TEMP}/overlay-maintainability-hardening/overlay-maintainability-hardening.patch"
          test "$(sha256sum "${patch}" | awk '{print $1}')" = "${EXPECTED_PATCH_SHA256}"
          git apply --check "${patch}"
          git apply "${patch}"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Library/Homebrew
          test "$(git write-tree)" = "${EXPECTED_TREE}"
          git commit -m "Harden overlay durability and maintenance gates"
          test "$(git rev-parse 'HEAD^{tree}')" = "${EXPECTED_TREE}"

          isolated_home="$(mktemp -d)"
          askpass="$(mktemp)"
          trap 'rm -rf "${isolated_home}"; rm -f "${askpass}"' EXIT
          export HOME="${isolated_home}"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          cat >"${askpass}" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *) printf '%s\n' "${PUSH_TOKEN:?}" ;;
          esac
          ASKPASS
          chmod 0700 "${askpass}"
          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git -c core.hooksPath=/dev/null push \
              --force-with-lease=refs/heads/automation/overlay-maintainability-hardening-result:${EXPECTED_BASE} \
              origin HEAD:refs/heads/automation/overlay-maintainability-hardening-result
