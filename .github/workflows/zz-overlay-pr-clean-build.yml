name: Generate isolated overlay Ruby style correction

on:
  push:
    branches:
      - automation/overlay-pr-clean-build

permissions: {}

env:
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_DEVELOPER: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      patch_sha256: ${{ steps.patch.outputs.sha256 }}
    steps:
      - name: Check out the exact hardened candidate without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 92d49c3894670fbe0058ff9d584628b335408cd7
          fetch-depth: 0
          persist-credentials: false

      - name: Apply safe Ruby style corrections only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin overlay-store
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR origin/overlay-store...HEAD -- \
              'Library/Homebrew/**/*.rb' \
              'Library/Homebrew/**/*.rbi'
          )
          ((${#files[@]} > 0))
          bin/brew style --fix "${files[@]}" || true
          if git diff --diff-filter=D --name-only -- Library/Homebrew | grep -q .; then
            echo "Ruby style correction unexpectedly deleted a file" >&2
            exit 1
          fi
          mapfile -t modified < <(git diff --name-only -- Library/Homebrew)
          for file in "${modified[@]}"; do
            case "${file}" in
              *.rb) ruby -c "${file}" >/dev/null ;;
              *.rbi) ;;
              *)
                echo "unexpected Ruby style path: ${file}" >&2
                exit 1
                ;;
            esac
          done

      - name: Verify the mechanically corrected Ruby tree
        shell: bash
        run: |
          set -euo pipefail
          bin/brew typecheck
          bin/brew tests --no-parallel \
            --only=overlay/core,overlay/install_session,overlay/reinstall_session,overlay/reinstall_backup,formula_installer,diagnostic_checks

      - name: Package the source-only correction
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          patch="${RUNNER_TEMP}/overlay-ruby-style.patch"
          git diff --binary -- Library/Homebrew >"${patch}"
          test -s "${patch}"
          python3 - "${patch}" <<'PY'
          import pathlib
          import re
          import sys

          patch = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          paths = re.findall(r"^diff --git a/(.+?) b/(.+?)$", patch, re.MULTILINE)
          if not paths:
              raise SystemExit("Ruby style patch has no changed paths")
          for old, new in paths:
              if old != new:
                  raise SystemExit(f"Ruby style patch renamed a file: {old} -> {new}")
              if not old.startswith("Library/Homebrew/") or not old.endswith((".rb", ".rbi")):
                  raise SystemExit(f"unexpected Ruby style path: {old}")
          print("Ruby style patch paths:")
          for path, _ in paths:
              print(path)
          PY
          sha256="$(sha256sum "${patch}" | awk '{print $1}')"
          printf 'sha256=%s\n' "${sha256}" >>"${GITHUB_OUTPUT}"

      - name: Upload the verified Ruby correction
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overlay-ruby-style
          path: ${{ runner.temp }}/overlay-ruby-style.patch
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the exact publication branch without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: automation/overlay-ruby-autofix-result
          fetch-depth: 0
          persist-credentials: false

      - name: Download the verified Ruby correction
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: overlay-ruby-style
          path: ${{ runner.temp }}/overlay-ruby-style

      - name: Verify, commit, and publish the correction
        shell: bash
        env:
          EXPECTED_BASE: 92d49c3894670fbe0058ff9d584628b335408cd7
          EXPECTED_PATCH_SHA256: ${{ needs.build.outputs.patch_sha256 }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin
          test "$(git rev-parse HEAD)" = "${EXPECTED_BASE}"
          patch="${RUNNER_TEMP}/overlay-ruby-style/overlay-ruby-style.patch"
          test "$(sha256sum "${patch}" | awk '{print $1}')" = "${EXPECTED_PATCH_SHA256}"
          python3 - "${patch}" <<'PY'
          import pathlib
          import re
          import sys

          patch = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          for old, new in re.findall(r"^diff --git a/(.+?) b/(.+?)$", patch, re.MULTILINE):
              if old != new or not old.startswith("Library/Homebrew/") or not old.endswith((".rb", ".rbi")):
                  raise SystemExit(f"unexpected Ruby style path: {old} -> {new}")
          PY
          git apply --check "${patch}"
          git apply "${patch}"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Library/Homebrew
          git commit -m "Normalize overlay Ruby style"

          isolated_home="$(mktemp -d)"
          askpass="$(mktemp)"
          trap 'rm -rf "${isolated_home}"; rm -f "${askpass}"' EXIT
          export HOME="${isolated_home}"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          cat >"${askpass}" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *) printf '%s\n' "${PUSH_TOKEN:?}" ;;
          esac
          ASKPASS
          chmod 0700 "${askpass}"
          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git -c core.hooksPath=/dev/null push \
              --force-with-lease=refs/heads/automation/overlay-ruby-autofix-result:${EXPECTED_BASE} \
              origin HEAD:refs/heads/automation/overlay-ruby-autofix-result
