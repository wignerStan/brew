name: Inspect overlay PR style debt

on:
  push:
    branches:
      - automation/overlay-pr-clean-build

permissions:
  contents: read

env:
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_DEVELOPER: "1"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the real PR candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/overlay-pr-clean
          fetch-depth: 0
          persist-credentials: false

      - name: Report remaining style offenses
        shell: bash
        run: |
          set -o pipefail
          bin/brew style --display-cop-names \
            Library/Homebrew/overlay/core.rb \
            Library/Homebrew/utils/overlay/core.sh \
            Library/Homebrew/diagnostic.rb \
            Library/Homebrew/test/diagnostic_checks_spec.rb
