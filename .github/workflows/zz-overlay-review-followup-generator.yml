          mkdir -p "${committed}/backup/foo/2.0/bin" "${prefix}/Cellar/foo/2.0/bin"
          printf 'old\\n' >"${committed}/backup/foo/2.0/bin/foo"
          printf 'new\\n' >"${prefix}/Cellar/foo/2.0/bin/foo"
