name: Retry overlay review follow-up candidate

on:
  push:
    branches:
      - automation/overlay-review-followup-work

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message == 'Retry overlay review follow-up candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out generator branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: automation/overlay-review-followup-work
          fetch-depth: 0

      - name: Publish source-only snapshot for exact review
        shell: bash
        env:
          BASE_SHA: 6d67dcb51bc2136bea491dd2d466df1c2d3c60e3
          CANDIDATE_BRANCH: automation/overlay-review-followup-candidate
        run: |
          set -euo pipefail
          git cat-file blob 4bff114a0de29f55acbb48b547d3a61fc75153e5 > /tmp/original-generator.yml
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('/tmp/original-generator.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          start = source.index(marker) + len(marker)
          lines = source[start:].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          ) + '\n'

          old_helper = (
              'def replace_once(source: str, old: str, new: str, label: str) -> str:\n'
              '    count = source.count(old)\n'
              '    if count != 1:\n'
              '        raise SystemExit(f"{label}: expected one match, found {count}")\n'
              '    return source.replace(old, new)\n'
          )
          new_helper = (
              'def shift_continuation(value: str, delta: int) -> str:\n'
              '    lines = value.splitlines(keepends=True)\n'
              '    if len(lines) < 2 or delta == 0:\n'
              '        return value\n'
              '    adjusted = []\n'
              '    for line in lines[1:]:\n'
              '        if not line.strip():\n'
              '            adjusted.append(line)\n'
              '        elif delta > 0:\n'
              '            adjusted.append(" " * delta + line)\n'
              '        else:\n'
              '            remove = min(-delta, len(line) - len(line.lstrip(" ")))\n'
              '            adjusted.append(line[remove:])\n'
              '    return lines[0] + "".join(adjusted)\n'
              '\n'
              'def replace_once(source: str, old: str, new: str, label: str) -> str:\n'
              '    deltas = (0, 2, 4, 6, 8, -2, -4, -6, -8)\n'
              '    counts = {}\n'
              '    seen = set()\n'
              '    for delta in deltas:\n'
              '        candidate = shift_continuation(old, delta)\n'
              '        replacement = shift_continuation(new, delta)\n'
              '        if candidate in seen:\n'
              '            continue\n'
              '        seen.add(candidate)\n'
              '        count = source.count(candidate)\n'
              '        counts[delta] = count\n'
              '        if count == 1:\n'
              '            return source.replace(candidate, replacement)\n'
              '    raise SystemExit(f"{label}: expected one match variant, found {counts}")\n'
          )
          if script.count(old_helper) != 1:
              raise SystemExit('unexpected replacement helper shape')
          script = script.replace(old_helper, new_helper, 1)

          opening = "python3 <<'PY'\n"
          closing = "\nPY\n\nchmod +x"
          if script.count(opening) != 1 or script.count(closing) != 1:
              raise SystemExit('unexpected generator heredoc shape')
          script = script.replace(opening, "python3 <<'PY_GENERATOR'\n", 1)
          script = script.replace(closing, "\nPY_GENERATOR\n\nchmod +x", 1)

          style_script = dedent(r'''
          python3 <<'PY_STYLE'
          from pathlib import Path

          def replace_section(source, start_marker, end_marker, replacement, label):
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              if source.find(start_marker, start + 1) != -1:
                  raise SystemExit(f"{label}: start marker is not unique")
              return source[:start] + replacement + source[end:]

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return source.replace(old, new, 1)

          core_path = Path("Library/Homebrew/overlay/core.rb")
          core = core_path.read_text(encoding="utf-8")

          mark_start = "      sig { params(keg_path: Pathname).void }\n      def mark_committed!(keg_path)\n"
          committed_start = "      sig { returns(T::Boolean) }\n      def committed_replacement?\n"
          mark_method = '''      sig { params(keg_path: Pathname).void }
          def mark_committed!(keg_path)
            state = validate_control_state!
            return if state == "committed" && committed_replacement?
            if state != "backed-up"
              raise TransactionFailure, "overlay reinstall cannot commit from state #{state.inspect}: #{@root}"
            end

            candidate = keg_path.expand_path
            replacement_available = (
              candidate == @final_version &&
              Overlay.local_keg_realization?(formula_name, version)
            )
            unless replacement_available
              raise TransactionFailure, "overlay reinstall replacement is unavailable: #{candidate}"
            end

            replacement_stat = candidate.lstat
            safe_replacement = replacement_stat.directory? && replacement_stat.uid == Process.uid
            unless safe_replacement
              raise TransactionFailure, "unsafe overlay reinstall replacement: #{candidate}"
            end

            marker = candidate/BASE_GENERATION_MARKER
            contents = Overlay.read_owned_file(
              marker,
              description: "administrator base-generation marker",
              max_bytes:   65,
            )
            if contents.nil?
              raise TransactionFailure, "overlay reinstall replacement has no base-generation marker: #{candidate}"
            end

            generation = contents.chomp
            Overlay.validate_base_generation!(generation)
            if contents != "#{generation}\n"
              raise TransactionFailure, "invalid overlay reinstall base-generation marker: #{marker}"
            end

            Overlay.durable_atomic_write!(@metadata_base_generation, "#{generation}\n", mode: 0600)
            Overlay.durable_atomic_write!(@metadata_replacement_device, "#{replacement_stat.dev}\n", mode: 0600)
            Overlay.durable_atomic_write!(@metadata_replacement_inode, "#{replacement_stat.ino}\n", mode: 0600)
            Overlay.durable_atomic_write!(@metadata_state, "committed\n", mode: 0600)
            Overlay.fsync_directory!(@root)
          end

          '''
          core = replace_section(core, mark_start, committed_start, mark_method, "mark committed method")

          restore_start = "      sig { void }\n      def restore!\n"
          committed_method = '''      sig { returns(T::Boolean) }
          def committed_replacement?
            state = Overlay.read_owned_file(
              @metadata_state,
              description: "overlay reinstall state",
              max_bytes:   32,
            )
            return false if state != "committed\n"

            generation = Overlay.read_owned_file(
              @metadata_base_generation,
              description: "overlay reinstall committed base generation",
              max_bytes:   65,
            )
            device = Overlay.read_owned_file(
              @metadata_replacement_device,
              description: "overlay reinstall committed device",
              max_bytes:   32,
            )
            inode = Overlay.read_owned_file(
              @metadata_replacement_inode,
              description: "overlay reinstall committed inode",
              max_bytes:   32,
            )
            complete_metadata = (
              generation&.match?(/\A[0-9a-f]{64}\n\z/) &&
              device&.match?(/\A[0-9]+\n\z/) &&
              inode&.match?(/\A[0-9]+\n\z/)
            )
            unless complete_metadata
              raise TransactionFailure, "incomplete committed overlay reinstall metadata: #{@root}"
            end

            recorded_generation = T.must(generation).chomp
            Overlay.validate_base_generation!(recorded_generation)
            unless Overlay.local_keg_realization?(formula_name, version)
              raise TransactionFailure, "committed overlay reinstall replacement is missing: #{@final_version}"
            end

            replacement_stat = @final_version.lstat
            expected_identity = [T.must(device).to_i, T.must(inode).to_i]
            actual_identity = [replacement_stat.dev, replacement_stat.ino]
            if actual_identity != expected_identity
              raise TransactionFailure, "committed overlay reinstall replacement changed: #{@final_version}"
            end

            marker = @final_version/BASE_GENERATION_MARKER
            if marker.exist? || marker.symlink?
              contents = Overlay.read_owned_file(
                marker,
                description: "administrator base-generation marker",
                max_bytes:   65,
              )
              if contents != "#{recorded_generation}\n"
                raise TransactionFailure, "committed overlay reinstall marker changed: #{marker}"
              end
            end
            true
          end

          '''
          core = replace_section(core, committed_start, restore_start, committed_method, "committed replacement method")

          core = replace_once(
              core,
              '''        if state == "committed"
                raise TransactionFailure, "refusing to restore a committed overlay reinstall: #{@root}"
              end
              prepare_final_rack!
          ''',
              '''        if state == "committed"
                raise TransactionFailure, "refusing to restore a committed overlay reinstall: #{@root}"
              end

              prepare_final_rack!
          ''',
              "committed restore guard spacing",
          )

          cleanup_start = "      sig { void }\n      def cleanup_control_root!\n"
          cleanup_end = "    end\n\n    private_constant :TRANSACTION_MARKER, :BASE_GENERATION_PATTERN\n"
          cleanup_method = '''      sig { void }
          def cleanup_control_root!
            managed_root = @root.exist? || @root.symlink?
            unless managed_root
              Overlay.unregister_reinstall_backup(self)
              return
            end

            root_stat = @root.lstat
            safe_root = root_stat.directory? && !@root.symlink? && root_stat.uid == Process.uid
            raise TransactionFailure, "unsafe overlay reinstall control path: #{@root}" unless safe_root

            Overlay.remove_tree_durable!(
              @root,
              expected_device: root_stat.dev,
              expected_inode:  root_stat.ino,
            )
          ensure
            control_root_removed = !@root.exist? && !@root.symlink?
            Overlay.unregister_reinstall_backup(self) if control_root_removed
          end
          '''
          core = replace_section(core, cleanup_start, cleanup_end, cleanup_method, "cleanup control root")

          helper_start = "    sig {\n      params(\n        path: Pathname,\n        expected_device: T.nilable(Integer),\n        expected_inode: T.nilable(Integer),\n      ).void\n    }\n    def self.remove_tree_durable!(path, expected_device: nil, expected_inode: nil)\n"
          inherited_def = "    def self.inherited_path?(path)\n"
          helper = '''    sig {
            params(
              path:            Pathname,
              expected_device: T.nilable(Integer),
              expected_inode:  T.nilable(Integer),
            ).void
          }
          def self.remove_tree_durable!(path, expected_device: nil, expected_inode: nil)
            path = path.expand_path
            path_present = path.exist? || path.symlink?
            return unless path_present

            parent = path.parent
            parent_stat = parent.lstat
            path_stat = path.lstat
            expected_identity = if expected_device.nil? && expected_inode.nil?
              true
            elsif expected_device && expected_inode
              path_stat.dev == expected_device && path_stat.ino == expected_inode
            else
              false
            end
            safe_path = (
              parent_stat.directory? &&
              !parent.symlink? &&
              parent_stat.uid == Process.uid &&
              path_stat.directory? &&
              !path.symlink? &&
              path_stat.uid == Process.uid &&
              expected_identity
            )
            raise TransactionFailure, "unsafe overlay cleanup path: #{path}" unless safe_path

            tombstone = T.let(nil, T.nilable(Pathname))
            32.times do
              candidate = parent/".cleanup-#{path.basename}-#{SecureRandom.hex(8)}"
              next if candidate.exist? || candidate.symlink?

              begin
                File.rename(path, candidate)
              rescue Errno::EEXIST
                next
              end
              tombstone = candidate
              break
            end
            if tombstone.nil? || path.exist? || path.symlink?
              raise TransactionFailure, "could not detach overlay cleanup path: #{path}"
            end

            fsync_directory!(parent, expected_device: parent_stat.dev, expected_inode: parent_stat.ino)
            detached_stat = tombstone.lstat
            stable_detach = detached_stat.directory? && detached_stat.uid == path_stat.uid &&
                            detached_stat.dev == path_stat.dev && detached_stat.ino == path_stat.ino
            raise TransactionFailure, "overlay cleanup path changed while detaching: #{path}" unless stable_detach

            FileUtils.rm_rf(tombstone)
            if tombstone.exist? || tombstone.symlink?
              raise TransactionFailure, "could not remove detached overlay cleanup path: #{tombstone}"
            end

            fsync_directory!(parent, expected_device: parent_stat.dev, expected_inode: parent_stat.ino)
          rescue TransactionFailure
            raise
          rescue SystemCallError, IOError => e
            raise TransactionFailure, "could not durably remove overlay tree #{path}: #{e.message}"
          end

          sig { params(path: T.any(Pathname, String)).returns(T::Boolean) }
          '''
          core = replace_section(core, helper_start, inherited_def, helper, "durable tree removal")

          core = replace_once(
              core,
              "        sig { params(backup: ReinstallBackup).void }\n    def self.register_reinstall_backup(backup)\n",
              "    sig { params(backup: ReinstallBackup).void }\n    def self.register_reinstall_backup(backup)\n",
              "reinstall registry indentation",
          )
          core = replace_once(
              core,
              '''      if existing && existing != backup
                raise TransactionFailure, "another overlay reinstall backup is active for #{backup.formula_name}"
              end
              @reinstall_backups[key] = backup
          ''',
              '''      if existing && existing != backup
                raise TransactionFailure, "another overlay reinstall backup is active for #{backup.formula_name}"
              end

              @reinstall_backups[key] = backup
          ''',
              "reinstall registry guard spacing",
          )
          core_path.write_text(core, encoding="utf-8")

          spec_path = Path("Library/Homebrew/test/overlay/core_spec.rb")
          spec = spec_path.read_text(encoding="utf-8")
          spec = replace_once(
              spec,
              '  end\n\n\n  it "rejects an overlay-managed record whose final target escapes the base Cellar" do\n',
              '  end\n\n  it "rejects an overlay-managed record whose final target escapes the base Cellar" do\n',
              "managed link spec spacing",
          )
          spec_path.write_text(spec, encoding="utf-8")
          PY_STYLE
          ''').lstrip()

          path_marker = 'mapfile -t paths </tmp/overlay-review-followup-paths\n'
          source_only = (
              style_script
              + "grep -v '^.github/workflows/' /tmp/overlay-review-followup-paths > "
              "/tmp/overlay-review-followup-source-paths\n"
              + 'mapfile -t paths </tmp/overlay-review-followup-source-paths\n'
          )
          if script.count(path_marker) != 1:
              raise SystemExit('unexpected candidate path marker')
          script = script.replace(path_marker, source_only, 1)

          checkout_marker = 'git checkout --detach --force "${clean_commit}"\n'
          publish_early = (
              checkout_marker
              + 'git push --force origin "${clean_commit}:refs/heads/${CANDIDATE_BRANCH}"\n'
              + 'printf \'source_candidate=%s\\n\' "${clean_commit}"\n'
              + 'exit 0\n'
          )
          if script.count(checkout_marker) != 1:
              raise SystemExit('unexpected clean checkout marker')
          script = script.replace(checkout_marker, publish_early, 1)
          Path('/tmp/overlay-review-followup-generator.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/overlay-review-followup-generator.sh
