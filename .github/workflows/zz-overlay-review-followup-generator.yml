name: Generate overlay review follow-up candidate

on:
  push:
    branches:
      - automation/overlay-review-followup-work

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message == 'Generate overlay review follow-up candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out generator branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: automation/overlay-review-followup-work
          fetch-depth: 0

      - name: Build and validate clean follow-up commit
        shell: bash
        env:
          BASE_SHA: 6d67dcb51bc2136bea491dd2d466df1c2d3c60e3
          CANDIDATE_BRANCH: automation/overlay-review-followup-candidate
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return source.replace(old, new)

          rebase_workflow = dedent(r'''\
          name: Rebase and validate overlay branch

          on:
            workflow_dispatch:
            schedule:
              - cron: "17 4 * * *"

          permissions: {}

          concurrency:
            group: rebase-overlay-branch
            cancel-in-progress: false

          env:
            CI: "1"
            HOMEBREW_DEVELOPER: "1"
            HOMEBREW_NO_AUTO_UPDATE: "1"

          jobs:
            prepare:
              if: github.repository == 'wangzheng15534-blip/brew'
              runs-on: ubuntu-latest
              timeout-minutes: 30
              permissions:
                contents: write
              outputs:
                changed: ${{ steps.rebase.outputs.changed }}
                before: ${{ steps.rebase.outputs.before }}
                after: ${{ steps.rebase.outputs.after }}
                tree: ${{ steps.rebase.outputs.tree }}
              steps:
                - name: Check out the deployment branch without persisted credentials
                  uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
                  with:
                    ref: overlay-store
                    fetch-depth: 0
                    persist-credentials: false

                - name: Rebase onto current Homebrew main
                  id: rebase
                  shell: bash
                  run: |
                    set -euo pipefail

                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git config core.hooksPath /dev/null
                    git remote add upstream https://github.com/Homebrew/brew.git 2>/dev/null ||
                      git remote set-url upstream https://github.com/Homebrew/brew.git
                    git fetch --prune origin overlay-store
                    git fetch --prune upstream main
                    git checkout --detach origin/overlay-store

                    before="$(git rev-parse HEAD)"
                    printf 'before=%s\n' "${before}" >>"${GITHUB_OUTPUT}"
                    if ! git -c core.hooksPath=/dev/null rebase upstream/main; then
                      git rebase --abort || true
                      echo "Upstream rebase has semantic conflicts; overlay-store was left unchanged." >&2
                      exit 1
                    fi
                    after="$(git rev-parse HEAD)"
                    tree="$(git rev-parse 'HEAD^{tree}')"
                    printf 'after=%s\n' "${after}" >>"${GITHUB_OUTPUT}"
                    printf 'tree=%s\n' "${tree}" >>"${GITHUB_OUTPUT}"
                    if [[ "${before}" == "${after}" ]]; then
                      printf 'changed=false\n' >>"${GITHUB_OUTPUT}"
                    else
                      printf 'changed=true\n' >>"${GITHUB_OUTPUT}"
                    fi

                - name: Publish the immutable candidate with the repository token
                  if: steps.rebase.outputs.changed == 'true'
                  shell: bash
                  env:
                    AFTER: ${{ steps.rebase.outputs.after }}
                    EXPECTED_TREE: ${{ steps.rebase.outputs.tree }}
                    PREPARE_TOKEN: ${{ github.token }}
                  run: |
                    set -euo pipefail
                    test "$(git rev-parse HEAD)" = "${AFTER}"
                    test "$(git rev-parse 'HEAD^{tree}')" = "${EXPECTED_TREE}"

                    askpass="$(mktemp)"
                    trap 'rm -f "${askpass}"' EXIT
                    cat >"${askpass}" <<'ASKPASS'
                    #!/bin/sh
                    case "$1" in
                      *Username*) printf '%s\n' x-access-token ;;
                      *) printf '%s\n' "${PREPARE_TOKEN:?}" ;;
                    esac
                    ASKPASS
                    chmod 0700 "${askpass}"

                    candidate_ref=refs/heads/automation/overlay-rebase-candidate
                    candidate_before="$(
                      GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
                        git ls-remote --heads origin "${candidate_ref}" | awk '{print $1}'
                    )"
                    GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
                      git push \
                        --force-with-lease="${candidate_ref}:${candidate_before}" \
                        origin "${AFTER}:${candidate_ref}"

            validate:
              needs: prepare
              if: needs.prepare.outputs.changed == 'true'
              runs-on: ubuntu-latest
              timeout-minutes: 150
              permissions:
                contents: read
              outputs:
                validated_sha: ${{ steps.attest.outputs.sha }}
                validated_tree: ${{ steps.attest.outputs.tree }}
              steps:
                - name: Check out the exact proposed SHA on a fresh runner
                  uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
                  with:
                    ref: ${{ needs.prepare.outputs.after }}
                    fetch-depth: 0
                    persist-credentials: false

                - name: Verify the remote candidate and comparison base
                  shell: bash
                  env:
                    AFTER: ${{ needs.prepare.outputs.after }}
                    EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
                  run: |
                    set -euo pipefail
                    git config core.hooksPath /dev/null
                    git remote add upstream https://github.com/Homebrew/brew.git 2>/dev/null ||
                      git remote set-url upstream https://github.com/Homebrew/brew.git
                    git fetch --prune upstream main
                    git fetch --prune origin automation/overlay-rebase-candidate
                    test "$(git rev-parse HEAD)" = "${AFTER}"
                    test "$(git rev-parse FETCH_HEAD)" = "${AFTER}"
                    test "$(git rev-parse 'HEAD^{tree}')" = "${EXPECTED_TREE}"

                - name: Validate patch formatting and shell syntax
                  shell: bash
                  run: |
                    set -euo pipefail
                    git diff --check upstream/main...HEAD
                    bash -n bin/brew Library/Homebrew/utils/overlay.sh
                    while IFS= read -r test_script; do
                      bash -n "${test_script}"
                    done < <(find Library/Homebrew/test/support -maxdepth 1 -name 'overlay_*.sh' -print | sort)
                    python3 -m py_compile Library/Homebrew/test/support/overlay_style_delta_check.py

                - name: Run complete overlay recovery matrix
                  shell: bash
                  run: |
                    set -euo pipefail
                    bash Library/Homebrew/test/support/overlay_final_review_reproducer.sh "$PWD"

                - name: Run full Homebrew RSpec suite
                  shell: bash
                  run: |
                    set -euo pipefail
                    bin/brew tests --no-parallel

                - name: Reject style offenses on the rebased overlay delta
                  shell: bash
                  run: |
                    set -euo pipefail
                    python3 Library/Homebrew/test/support/overlay_style_delta_check.py upstream/main HEAD

                - name: Run Sorbet
                  shell: bash
                  run: |
                    set -euo pipefail
                    bin/brew typecheck

                - name: Attest the exact validated commit and tree
                  id: attest
                  shell: bash
                  env:
                    AFTER: ${{ needs.prepare.outputs.after }}
                    EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
                  run: |
                    set -euo pipefail
                    test "$(git rev-parse HEAD)" = "${AFTER}"
                    test "$(git rev-parse 'HEAD^{tree}')" = "${EXPECTED_TREE}"
                    printf 'sha=%s\n' "${AFTER}" >>"${GITHUB_OUTPUT}"
                    printf 'tree=%s\n' "${EXPECTED_TREE}" >>"${GITHUB_OUTPUT}"

            promote:
              needs: [prepare, validate]
              if: needs.prepare.outputs.changed == 'true' && needs.validate.result == 'success'
              runs-on: ubuntu-latest
              timeout-minutes: 15
              environment: overlay-promotion
              permissions: {}
              steps:
                - name: Promote only the exact validated object on a fresh runner
                  shell: bash
                  env:
                    BEFORE: ${{ needs.prepare.outputs.before }}
                    AFTER: ${{ needs.prepare.outputs.after }}
                    EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
                    VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
                    VALIDATED_TREE: ${{ needs.validate.outputs.validated_tree }}
                    OVERLAY_PROMOTION_TOKEN: ${{ secrets.OVERLAY_PROMOTION_TOKEN }}
                  run: |
                    set -euo pipefail
                    if [[ -z "${OVERLAY_PROMOTION_TOKEN}" ]]; then
                      echo "::error::OVERLAY_PROMOTION_TOKEN must grant Contents and Workflows write access to wangzheng15534-blip/brew"
                      exit 1
                    fi
                    test "${AFTER}" = "${VALIDATED_SHA}"
                    test "${EXPECTED_TREE}" = "${VALIDATED_TREE}"

                    isolated_home="$(mktemp -d)"
                    repository="$(mktemp -d)"
                    template_dir="$(mktemp -d)"
                    askpass="$(mktemp)"
                    trap 'rm -rf "${isolated_home}" "${repository}" "${template_dir}"; rm -f "${askpass}"' EXIT
                    export HOME="${isolated_home}"
                    export PATH=/usr/bin:/bin
                    export GIT_CONFIG_NOSYSTEM=1
                    export GIT_CONFIG_GLOBAL=/dev/null
                    export GIT_TEMPLATE_DIR="${template_dir}"

                    cat >"${askpass}" <<'ASKPASS'
                    #!/bin/sh
                    case "$1" in
                      *Username*) printf '%s\n' x-access-token ;;
                      *) printf '%s\n' "${OVERLAY_PROMOTION_TOKEN:?}" ;;
                    esac
                    ASKPASS
                    chmod 0700 "${askpass}"

                    /usr/bin/git init "${repository}"
                    /usr/bin/git -C "${repository}" config core.hooksPath /dev/null
                    /usr/bin/git -C "${repository}" remote add origin \
                      https://github.com/wangzheng15534-blip/brew.git
                    GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
                      /usr/bin/git -C "${repository}" -c protocol.file.allow=never fetch \
                        --no-tags --prune origin \
                        +refs/heads/automation/overlay-rebase-candidate:refs/remotes/origin/candidate \
                        +refs/heads/overlay-store:refs/remotes/origin/overlay-store

                    test "$(/usr/bin/git -C "${repository}" rev-parse refs/remotes/origin/candidate)" = "${AFTER}"
                    test "$(/usr/bin/git -C "${repository}" rev-parse refs/remotes/origin/overlay-store)" = "${BEFORE}"
                    test "$(/usr/bin/git -C "${repository}" rev-parse "${AFTER}^{tree}")" = "${EXPECTED_TREE}"

                    GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
                      /usr/bin/git -C "${repository}" push \
                        --force-with-lease=refs/heads/overlay-store:${BEFORE} \
                        origin ${AFTER}:refs/heads/overlay-store
          ''')
          Path(".github/workflows/rebase-upstream-overlay.yml").write_text(rebase_workflow, encoding="utf-8")

          validation_workflow = dedent(r'''\
          name: Validate native overlay

          on:
            pull_request:
              branches:
                - overlay-store
            push:
              branches:
                - 'fix/overlay-*'
                - 'refactor/overlay-*'

          permissions:
            contents: read

          env:
            CI: "1"
            HOMEBREW_DEVELOPER: "1"
            HOMEBREW_NO_AUTO_UPDATE: "1"

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 150
              steps:
                - name: Check out exact candidate
                  uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
                  with:
                    ref: ${{ github.event.pull_request.head.sha || github.sha }}
                    fetch-depth: 0
                    persist-credentials: false

                - name: Fetch overlay-store comparison base
                  shell: bash
                  run: |
                    set -euo pipefail
                    git fetch --prune origin overlay-store

                - name: Check formatting and shell syntax
                  shell: bash
                  run: |
                    set -euo pipefail
                    git diff --check origin/overlay-store...HEAD
                    bash -n bin/brew Library/Homebrew/utils/overlay.sh
                    while IFS= read -r test_script; do
                      bash -n "${test_script}"
                    done < <(find Library/Homebrew/test/support -maxdepth 1 -name 'overlay_*.sh' -print | sort)
                    python3 -m py_compile Library/Homebrew/test/support/overlay_style_delta_check.py

                - name: Reject style offenses on overlay changes
                  shell: bash
                  run: |
                    set -euo pipefail
                    python3 Library/Homebrew/test/support/overlay_style_delta_check.py origin/overlay-store HEAD

                - name: Run Sorbet
                  shell: bash
                  run: |
                    set -euo pipefail
                    bin/brew typecheck

                - name: Run complete overlay recovery matrix
                  shell: bash
                  run: |
                    set -euo pipefail
                    bash Library/Homebrew/test/support/overlay_final_review_reproducer.sh "$PWD"

                - name: Run full Homebrew RSpec suite
                  shell: bash
                  run: |
                    set -euo pipefail
                    bin/brew tests --no-parallel
          ''')
          Path(".github/workflows/overlay-validation.yml").write_text(validation_workflow, encoding="utf-8")

          promotion_docs = dedent('''\
          # Overlay Promotion Credentials

          The scheduled overlay rebase uses three jobs with separate GitHub-hosted runners:

          1. **Prepare** rebases `overlay-store` without executing repository code and publishes the exact result to `automation/overlay-rebase-candidate` using the repository-scoped `GITHUB_TOKEN`.
          2. **Validate** checks out that exact SHA on a fresh, read-only runner with persisted checkout credentials disabled, then runs the recovery matrix, the full RSpec suite, changed-line style validation, and Sorbet.
          3. **Promote** starts on another fresh runner, is gated by the protected `overlay-promotion` environment, never checks out or executes candidate files, fetches the exact validated commit into an empty repository with isolated Git configuration, verifies its commit and tree hashes, and updates `overlay-store` with an explicit force-with-lease.

          Promotion requires an Actions secret named `OVERLAY_PROMOTION_TOKEN` in `wangzheng15534-blip/brew`. Prefer a short-lived GitHub App installation token. If a fine-grained personal access token is used, scope it only to that repository with:

          - **Contents: write**, to update `overlay-store`.
          - **Workflows: write**, because the rebased commit can modify files under `.github/workflows`.

          Protect the `overlay-promotion` environment with required reviewers and restrict which branches may deploy through it. The promotion credential is exposed only inside the final job. Rotate it immediately if any preparation or validation job ever receives it.
          ''')
          Path("docs/Overlay-Promotion-Credentials.md").write_text(promotion_docs, encoding="utf-8")

          core_path = Path("Library/Homebrew/overlay/core.rb")
          core = core_path.read_text(encoding="utf-8")
          core = replace_once(
              core,
              '    @install_transactions = T.let({}, T::Hash[String, T.untyped])\n'
              '    @mutation_lock = T.let(nil, T.nilable(File))\n',
              '    @install_transactions = T.let({}, T::Hash[String, T.untyped])\n'
              '    @reinstall_backups = T.let({}, T::Hash[String, T.untyped])\n'
              '    @mutation_lock = T.let(nil, T.nilable(File))\n',
              "reinstall registry",
          )
          core = replace_once(
              core,
              '''      sig { params(path: Pathname).void }
              def remove_tree_durable!(path)
                return unless path.exist? || path.symlink?

                parent = path.parent
                FileUtils.rm_rf(path)
                if path.exist? || path.symlink?
                  raise TransactionFailure, "could not remove overlay transaction path: #{path}"
                end
                Overlay.fsync_directory!(parent)
              end
''',
              '''      sig { params(path: Pathname).void }
              def remove_tree_durable!(path)
                Overlay.remove_tree_durable!(path)
              end
''',
              "formula cleanup delegation",
          )
          core = replace_once(
              core,
              '        @metadata_state = T.let(@root/"state", Pathname)\n'
              '        @owner_lock_path = T.let(@root/"owner.lock", Pathname)\n',
              '        @metadata_state = T.let(@root/"state", Pathname)\n'
              '        @metadata_base_generation = T.let(@root/"committed_base_generation", Pathname)\n'
              '        @metadata_replacement_device = T.let(@root/"committed_device", Pathname)\n'
              '        @metadata_replacement_inode = T.let(@root/"committed_inode", Pathname)\n'
              '        @owner_lock_path = T.let(@root/"owner.lock", Pathname)\n',
              "reinstall commit metadata paths",
          )
          core = replace_once(
              core,
              '        Overlay.durable_atomic_write!(@metadata_state, "backed-up\\n", mode: 0600)\n'
              '        Overlay.clear_caches!\n'
              '        self\n',
              '        Overlay.durable_atomic_write!(@metadata_state, "backed-up\\n", mode: 0600)\n'
              '        Overlay.clear_caches!\n'
              '        Overlay.register_reinstall_backup(self)\n'
              '        self\n',
              "register reinstall backup",
          )
          core = replace_once(
              core,
              '''        ensure
                  release_owner_lock!
                end
                raise
              end

              sig { returns(T::Boolean) }
              def committed_replacement?
                return false unless Overlay.local_keg_realization?(formula_name, version)

                marker = @final_version/BASE_GENERATION_MARKER
                contents = Overlay.read_owned_file(
                  marker,
                  description: "administrator base-generation marker",
                  max_bytes:   65,
                )
                return false if contents.nil?

                generation = contents.chomp
                Overlay.validate_base_generation!(generation)
                contents == "#{generation}\\n"
              end
''',
              '''        ensure
                  Overlay.unregister_reinstall_backup(self)
                  release_owner_lock!
                end
                raise
              end

              sig { params(keg_path: Pathname).void }
              def mark_committed!(keg_path)
                state = validate_control_state!
                return if state == "committed" && committed_replacement?
                unless state == "backed-up"
                  raise TransactionFailure, "overlay reinstall cannot commit from state #{state.inspect}: #{@root}"
                end

                candidate = keg_path.expand_path
                unless candidate == @final_version && Overlay.local_keg_realization?(formula_name, version)
                  raise TransactionFailure, "overlay reinstall replacement is unavailable: #{candidate}"
                end
                replacement_stat = candidate.lstat
                unless replacement_stat.directory? && replacement_stat.uid == Process.uid
                  raise TransactionFailure, "unsafe overlay reinstall replacement: #{candidate}"
                end

                marker = candidate/BASE_GENERATION_MARKER
                contents = Overlay.read_owned_file(
                  marker,
                  description: "administrator base-generation marker",
                  max_bytes:   65,
                )
                if contents.nil?
                  raise TransactionFailure, "overlay reinstall replacement has no base-generation marker: #{candidate}"
                end
                generation = contents.chomp
                Overlay.validate_base_generation!(generation)
                unless contents == "#{generation}\\n"
                  raise TransactionFailure, "invalid overlay reinstall base-generation marker: #{marker}"
                end

                Overlay.durable_atomic_write!(@metadata_base_generation, "#{generation}\\n", mode: 0600)
                Overlay.durable_atomic_write!(@metadata_replacement_device, "#{replacement_stat.dev}\\n", mode: 0600)
                Overlay.durable_atomic_write!(@metadata_replacement_inode, "#{replacement_stat.ino}\\n", mode: 0600)
                Overlay.durable_atomic_write!(@metadata_state, "committed\\n", mode: 0600)
                Overlay.fsync_directory!(@root)
              end

              sig { returns(T::Boolean) }
              def committed_replacement?
                state = Overlay.read_owned_file(
                  @metadata_state,
                  description: "overlay reinstall state",
                  max_bytes:   32,
                )
                return false unless state == "committed\\n"

                generation = Overlay.read_owned_file(
                  @metadata_base_generation,
                  description: "overlay reinstall committed base generation",
                  max_bytes:   65,
                )
                device = Overlay.read_owned_file(
                  @metadata_replacement_device,
                  description: "overlay reinstall committed device",
                  max_bytes:   32,
                )
                inode = Overlay.read_owned_file(
                  @metadata_replacement_inode,
                  description: "overlay reinstall committed inode",
                  max_bytes:   32,
                )
                unless generation&.match?(/\\A[0-9a-f]{64}\\n\\z/) &&
                       device&.match?(/\\A[0-9]+\\n\\z/) && inode&.match?(/\\A[0-9]+\\n\\z/)
                  raise TransactionFailure, "incomplete committed overlay reinstall metadata: #{@root}"
                end

                recorded_generation = T.must(generation).chomp
                Overlay.validate_base_generation!(recorded_generation)
                unless Overlay.local_keg_realization?(formula_name, version)
                  raise TransactionFailure, "committed overlay reinstall replacement is missing: #{@final_version}"
                end
                replacement_stat = @final_version.lstat
                expected_identity = [T.must(device).to_i, T.must(inode).to_i]
                actual_identity = [replacement_stat.dev, replacement_stat.ino]
                unless actual_identity == expected_identity
                  raise TransactionFailure, "committed overlay reinstall replacement changed: #{@final_version}"
                end

                marker = @final_version/BASE_GENERATION_MARKER
                if marker.exist? || marker.symlink?
                  contents = Overlay.read_owned_file(
                    marker,
                    description: "administrator base-generation marker",
                    max_bytes:   65,
                  )
                  unless contents == "#{recorded_generation}\\n"
                    raise TransactionFailure, "committed overlay reinstall marker changed: #{marker}"
                  end
                end
                true
              end
''',
              "authoritative reinstall commit record",
          )
          core = replace_once(
              core,
              '        validate_control_state!\n'
              '        prepare_final_rack!\n',
              '        state = validate_control_state!\n'
              '        if state == "committed"\n'
              '          raise TransactionFailure, "refusing to restore a committed overlay reinstall: #{@root}"\n'
              '        end\n'
              '        prepare_final_rack!\n',
              "prevent committed rollback",
          )
          core = replace_once(
              core,
              '      sig { void }\n'
              '      def validate_control_state!\n',
              '      sig { returns(String) }\n'
              '      def validate_control_state!\n',
              "control state return type",
          )
          core = replace_once(
              core,
              '                         ["prepared\\n", "backed-up\\n"].include?(state)\n',
              '                         ["prepared\\n", "backed-up\\n", "committed\\n"].include?(state)\n',
              "control states",
          )
          core = replace_once(
              core,
              '        safe_backup = backup_version.directory? && !backup_version.symlink? && backup_version.stat.uid == Process.uid\n'
              '        raise TransactionFailure, "overlay reinstall backup is unavailable: #{backup_version}" unless safe_backup\n'
              '      end\n\n'
              '      sig { void }\n'
              '      def prepare_final_rack!\n',
              '        safe_backup = backup_version.directory? && !backup_version.symlink? && backup_version.stat.uid == Process.uid\n'
              '        raise TransactionFailure, "overlay reinstall backup is unavailable: #{backup_version}" unless safe_backup\n\n'
              '        T.must(state).chomp\n'
              '      end\n\n'
              '      sig { void }\n'
              '      def prepare_final_rack!\n',
              "return control state",
          )
          old_cleanup = '''      sig { void }
              def cleanup_control_root!
                managed_root = @root.exist? || @root.symlink?
                return unless managed_root

                parent = @root.parent
                safe_root = @root.directory? && !@root.symlink? && @root.stat.uid == Process.uid
                raise TransactionFailure, "unsafe overlay reinstall control path: #{@root}" unless safe_root

                FileUtils.rm_rf(@root)
                if @root.exist? || @root.symlink?
                  raise TransactionFailure, "could not remove overlay reinstall control path: #{@root}"
                end

                Overlay.fsync_directory!(parent)
              end
'''
          new_cleanup = '''      sig { void }
              def cleanup_control_root!
                managed_root = @root.exist? || @root.symlink?
                unless managed_root
                  Overlay.unregister_reinstall_backup(self)
                  return
                end

                root_stat = @root.lstat
                safe_root = root_stat.directory? && !@root.symlink? && root_stat.uid == Process.uid
                raise TransactionFailure, "unsafe overlay reinstall control path: #{@root}" unless safe_root

                Overlay.remove_tree_durable!(
                  @root,
                  expected_device: root_stat.dev,
                  expected_inode:  root_stat.ino,
                )
              ensure
                Overlay.unregister_reinstall_backup(self) unless @root.exist? || @root.symlink?
              end
'''
          core = replace_once(core, old_cleanup, new_cleanup, "reinstall tombstone cleanup")
          core = replace_once(
              core,
              '      ensure\n'
              '        release_owner_lock! if @finished\n'
              '      end\n\n'
              '      sig { void }\n'
              '      def discard!\n',
              '      ensure\n'
              '        release_owner_lock! if @finished || (!@root.exist? && !@root.symlink?)\n'
              '      end\n\n'
              '      sig { void }\n'
              '      def discard!\n',
              "restore lock release after detach",
          )
          core = replace_once(
              core,
              '      ensure\n'
              '        release_owner_lock! if @finished\n'
              '      end\n\n'
              '      private\n',
              '      ensure\n'
              '        release_owner_lock! if @finished || (!@root.exist? && !@root.symlink?)\n'
              '      end\n\n'
              '      private\n',
              "discard lock release after detach",
          )

          registry_marker = '''    sig { params(formula_name: String, transaction: FormulaTransaction).void }
          def self.unregister_transaction(formula_name, transaction)
