name: Retry overlay review follow-up candidate

on:
  push:
    branches:
      - automation/overlay-review-followup-work

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message == 'Retry overlay review follow-up candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out generator branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: automation/overlay-review-followup-work
          fetch-depth: 0

      - name: Execute the reviewed generator payload outside workflow parsing
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob 4bff114a0de29f55acbb48b547d3a61fc75153e5 > /tmp/original-generator.yml
          python3 <<'PY'
          from pathlib import Path

          source = Path('/tmp/original-generator.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          start = source.index(marker) + len(marker)
          lines = source[start:].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          ) + '\n'
          Path('/tmp/overlay-review-followup-generator.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/overlay-review-followup-generator.sh
