name: Retry overlay review follow-up candidate

on:
  push:
    branches:
      - automation/overlay-review-followup-work

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message == 'Retry overlay review follow-up candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out generator branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: automation/overlay-review-followup-work
          fetch-depth: 0

      - name: Execute the reviewed generator payload outside workflow parsing
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob 4bff114a0de29f55acbb48b547d3a61fc75153e5 > /tmp/original-generator.yml
          python3 <<'PY'
          from pathlib import Path

          source = Path('/tmp/original-generator.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          start = source.index(marker) + len(marker)
          lines = source[start:].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          ) + '\n'

          old_helper = '''def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return source.replace(old, new)
'''
          new_helper = '''def normalize_block(value: str) -> str:
              lines = value.splitlines(keepends=True)
              if len(lines) < 2:
                  return value
              first_indent = len(lines[0]) - len(lines[0].lstrip(" "))
              continuation = [
                  len(line) - len(line.lstrip(" "))
                  for line in lines[1:]
                  if line.strip()
              ]
              if not continuation:
                  return value
              extra = min(continuation) - first_indent
              if extra <= 0:
                  return value
              return lines[0] + "".join(
                  line[extra:] if line.startswith(" " * extra) else line
                  for line in lines[1:]
              )

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              old = normalize_block(old)
              new = normalize_block(new)
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return source.replace(old, new)
'''
          if script.count(old_helper) != 1:
              raise SystemExit('unexpected replacement helper shape')
          script = script.replace(old_helper, new_helper, 1)

          opening = "python3 <<'PY'\n"
          closing = "\nPY\n\nchmod +x"
          if script.count(opening) != 1 or script.count(closing) != 1:
              raise SystemExit('unexpected generator heredoc shape')
          script = script.replace(opening, "python3 <<'PY_GENERATOR'\n", 1)
          script = script.replace(closing, "\nPY_GENERATOR\n\nchmod +x", 1)
          Path('/tmp/overlay-review-followup-generator.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/overlay-review-followup-generator.sh
