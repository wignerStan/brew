name: Retry overlay review follow-up after Sorbet narrowing

on:
  push:
    branches:
      - automation/overlay-review-followup-work

permissions:
  contents: write

jobs:
  correct:
    if: github.event.head_commit.message == 'Retry overlay review follow-up after Sorbet narrowing'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact source candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: automation/overlay-review-followup-candidate
          fetch-depth: 0

      - name: Run the exact rewrite with flow-sensitive Sorbet corrections
        shell: bash
        env:
          BASE_SHA: 6d67dcb51bc2136bea491dd2d466df1c2d3c60e3
          CANDIDATE_BRANCH: automation/overlay-review-followup-candidate
        run: |
          set -euo pipefail
          git cat-file blob 6f8096404347dc542e0ec8aa6bbcf78d7daf433f > /tmp/exact-source-workflow.yml
          python3 <<'PY'
          from pathlib import Path

          source = Path('/tmp/exact-source-workflow.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          start = source.index(marker) + len(marker)
          lines = source[start:].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          ) + '\n'
          replacements = {
              '"        recorded_generation = T.must(generation).chomp",':
                  '"        recorded_generation = generation.chomp",',
              '"        expected_identity = [T.must(device).to_i, T.must(inode).to_i]",':
                  '"        expected_identity = [device.to_i, inode.to_i]",',
              '"      detached_path = T.must(tombstone)",':
                  '"      detached_path = tombstone",',
          }
          for old, new in replacements.items():
              count = script.count(old)
              if count != 1:
                  raise SystemExit(f'expected one Sorbet fragment {old!r}, found {count}')
              script = script.replace(old, new, 1)
          Path('/tmp/exact-source.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/exact-source.sh
