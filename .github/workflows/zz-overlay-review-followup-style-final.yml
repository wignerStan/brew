name: Format and validate overlay review follow-up source

on:
  push:
    branches:
      - automation/overlay-review-followup-work

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Format and validate overlay review follow-up source'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact source candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: automation/overlay-review-followup-candidate
          fetch-depth: 0

      - name: Format overlay-owned changes and run source-only gates
        shell: bash
        env:
          BASE_SHA: 6d67dcb51bc2136bea491dd2d466df1c2d3c60e3
          CANDIDATE_BRANCH: automation/overlay-review-followup-candidate
        run: |
          set -euo pipefail

          bin/brew style --fix \
            Library/Homebrew/overlay/core.rb \
            Library/Homebrew/overlay/install_session.rb \
            Library/Homebrew/test/overlay/core_spec.rb \
            Library/Homebrew/test/overlay/reinstall_backup_spec.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Library/Homebrew/overlay/core.rb \
            Library/Homebrew/overlay/install_session.rb \
            Library/Homebrew/test/overlay/core_spec.rb \
            Library/Homebrew/test/overlay/reinstall_backup_spec.rb
          git commit --amend --no-edit

          test "$(git rev-list --count "${BASE_SHA}..HEAD")" -eq 1
          test -z "$(git rev-list --merges "${BASE_SHA}..HEAD")"
          git diff --check "${BASE_SHA}...HEAD"
          bash Library/Homebrew/test/support/overlay_reinstall_recovery_test.sh "$PWD"
          bash Library/Homebrew/test/support/overlay_transaction_recovery_test.sh "$PWD"
          bash Library/Homebrew/test/support/overlay_architecture_test.sh "$PWD"
          python3 Library/Homebrew/test/support/overlay_style_delta_check.py "${BASE_SHA}" HEAD
          bin/brew typecheck
          bin/brew tests --no-parallel \
            --only=overlay/core,overlay/install_session,overlay/reinstall_session,overlay/reinstall_backup,formula_installer

          git push --force origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
          printf 'source_candidate=%s\n' "$(git rev-parse HEAD)"
