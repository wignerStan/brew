name: Finalize overlay install-session refactor

on:
  push:
    branches:
      - refactor/overlay-maintainability

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Bootstrap final overlay install-session refactor'
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refactor/overlay-maintainability
          fetch-depth: 0

      - name: Finalize implementation and seam tests
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path_name, old, new):
              path = Path(path_name)
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected one {old!r}, found {count}")
              path.write_text(source.replace(old, new), encoding="utf-8")

          formula_installer = Path("Library/Homebrew/formula_installer.rb")
          source = formula_installer.read_text(encoding="utf-8")
          old_constructor = "Homebrew::Overlay::InstallSession.new(@formula)"
          old_start = "@overlay_install_session.start!"
          if source.count(old_constructor) != 1 or source.count(old_start) != 1:
              raise SystemExit("FormulaInstaller session seams do not match the reviewed source")
          source = source.replace(old_constructor, "Homebrew::Overlay::InstallSession.new")
          source = source.replace(old_start, "@overlay_install_session.start!(formula)")
          formula_installer.write_text(source, encoding="utf-8")

          Path("Library/Homebrew/overlay/install_session.rb").write_text(
              dedent(
                  '''
                  # typed: strict
                  # frozen_string_literal: true

                  module Homebrew
                    module Overlay
                      # Owns overlay state spanning FormulaInstaller#install and #finish.
                      # FormulaInstaller retains native sequencing and delegates only the
                      # lower-layer lease, transaction, generation, and recovery lifecycle.
                      class InstallSession
                        sig { void }
                        def initialize
                          @formula_name = T.let(nil, T.nilable(String))
                          @formula_version = T.let(nil, T.nilable(String))
                          @formula_full_name = T.let(nil, T.nilable(String))
                          @transaction = T.let(nil, T.nilable(FormulaTransaction))
                          @base_generation = T.let(nil, T.nilable(String))
                          @local_keg_preexisting = T.let(false, T::Boolean)
                          @local_keg_committed = T.let(false, T::Boolean)
                          @mutation_owned = T.let(false, T::Boolean)
                          @previous_failed = T.let(nil, T.nilable(T::Boolean))
                          @base_mutation_lease = T.let(nil, T.nilable(File))
                        end

                        sig { params(formula: T.untyped).void }
                        def start!(formula)
                          @formula_name = formula.name
                          @formula_version = formula.pkg_version.to_s
                          @formula_full_name = formula.full_name

                          if Overlay.active?
                            @base_mutation_lease = Overlay.acquire_base_mutation_lease
                            @local_keg_preexisting = Overlay.local_keg_realization?(formula_name, formula_version)
                            generation = Overlay.current_base_generation
                            @base_generation = generation
                            @transaction = Overlay.begin_formula_transaction(formula, base_generation: generation)
                            Overlay.validate_local_install_target!(formula_name, formula_version) if @transaction.nil?
                          end

                          if Homebrew::EnvConfig.overlay? && !Overlay.mutation_active?
                            Overlay.begin_mutation!
                            @mutation_owned = true
                          end
                          return if @base_generation.nil?

                          @previous_failed = Homebrew.failed?
                          Homebrew.failed = false
                        end

                        sig { returns(T::Hash[String, String]) }
                        def build_environment
                          transaction = @transaction
                          return {} if transaction.nil?

                          { "HOMEBREW_OVERLAY_INSTALL_TRANSACTION_ID" => transaction.id }
                        end

                        sig { params(sandbox: T.untyped).void }
                        def apply_build_sandbox_rules(sandbox)
                          transaction = @transaction
                          sandbox.allow_read_if_exists(path: transaction.transaction_dir) if transaction
                        end

                        sig { returns(T::Boolean) }
                        def managed?
                          !@transaction.nil? || !@base_generation.nil?
                        end

                        sig { void }
                        def validate_install!
                          verify_base_generation!
                          raise_transaction_failure!
                        end

                        sig { void }
                        def publish!
                          verify_base_generation!
                          @transaction&.publish!
                        end

                        sig { params(keg: T.untyped).void }
                        def commit!(keg)
                          return unless managed?

                          raise_transaction_failure!
                          if (transaction = @transaction)
                            transaction.commit!
                          elsif (generation = @base_generation)
                            Overlay.verify_base_generation!(generation)
                            Overlay.record_base_generation!(keg.to_path, generation)
                            Overlay.verify_base_generation!(generation)
                            @local_keg_committed = true
                            Overlay.bump_generation!
                            @mutation_owned = false
                          end
                        end

                        sig { void }
                        def complete_native_install!
                          return if managed?

                          Overlay.bump_generation!
                          @mutation_owned = false
                        end

                        sig { void }
                        def abort!
                          transaction = @transaction
                          transaction.rollback! if transaction && !transaction.finished?
                          rollback_uncommitted_local_keg!
                        ensure
                          finalize_failed_mutation!
                        end

                        sig { void }
                        def close!
                          restore_failure_scope!
                        ensure
                          release_base_mutation_lease!
                        end

                        private

                        sig { returns(String) }
                        def formula_name = T.must(@formula_name)

                        sig { returns(String) }
                        def formula_version = T.must(@formula_version)

                        sig { returns(String) }
                        def formula_full_name = T.must(@formula_full_name)

                        sig { void }
                        def verify_base_generation!
                          generation = @base_generation
                          Overlay.verify_base_generation!(generation) if generation
                        end

                        sig { returns(T::Boolean) }
                        def package_committed?
                          @local_keg_committed || @transaction&.finished? || false
                        end

                        sig { void }
                        def raise_transaction_failure!
                          return if package_committed?
                          return if @base_generation.nil?

                          verify_base_generation!
                          return unless Homebrew.failed?

                          raise TransactionFailure,
                                "#{formula_full_name} failed before its private keg was committed; " \
                                "uncommitted package state was discarded"
                        end

                        sig { void }
                        def rollback_uncommitted_local_keg!
                          return unless Overlay.active?
                          return if @transaction || @local_keg_preexisting || @local_keg_committed
                          return if @base_generation.nil?

                          Overlay.discard_local_keg!(formula_name, formula_version)
                        end

                        sig { void }
                        def finalize_failed_mutation!
                          return unless @mutation_owned

                          begin
                            Overlay.sync!(mutation: true) if Overlay.mutation_active?
                          ensure
                            @mutation_owned = false
                          end
                        end

                        sig { void }
                        def restore_failure_scope!
                          previous_failed = @previous_failed
                          return if previous_failed.nil?

                          Homebrew.failed = previous_failed || Homebrew.failed?
                          @previous_failed = nil
                        end

                        sig { void }
                        def release_base_mutation_lease!
                          lease = @base_mutation_lease
                          return if lease.nil?

                          @base_mutation_lease = nil
                          Overlay.release_base_mutation_lease(lease)
                        end
                      end
                    end
                  end
                  '''
              ).lstrip(),
              encoding="utf-8",
          )

          Path("Library/Homebrew/test/overlay/install_session_spec.rb").write_text(
              dedent(
                  '''
                  # typed: true
                  # frozen_string_literal: true

                  require "formula"
                  require "keg"
                  require "overlay"
                  require "sandbox"

                  RSpec.describe Homebrew::Overlay::InstallSession do
                    let(:generation) { "a" * 64 }
                    let(:formula) do
                      instance_double(
                        Formula,
                        name:        "foo",
                        full_name:   "foo",
                        pkg_version: PkgVersion.parse("2.0"),
                      )
                    end
                    let(:keg) { instance_double(Keg, to_path: Pathname("/tmp/Cellar/foo/2.0")) }

                    before do
                      allow(Homebrew::Overlay).to receive_messages(
                        active?:                     false,
                        local_keg_realization?:      false,
                        mutation_active?:            false,
                        release_base_mutation_lease: nil,
                      )
                      allow(Homebrew::EnvConfig).to receive(:overlay?).and_return(false)
                      allow(Homebrew).to receive_messages(
                        "failed?": false,
                        "failed=": nil,
                      )
                    end

                    it "uses the current formula and exposes its transaction to the build sandbox" do
                      lease = instance_double(File)
                      transaction_dir = Pathname("/tmp/overlay/transactions/123")
                      transaction = instance_double(
                        Homebrew::Overlay::FormulaTransaction,
                        id:              "123",
                        transaction_dir: transaction_dir,
                        finished?:       false,
                      )
                      sandbox = instance_double(Sandbox)

                      allow(Homebrew::Overlay).to receive_messages(
                        active?:                     true,
                        acquire_base_mutation_lease: lease,
                        current_base_generation:     generation,
                        mutation_active?:            true,
                      )
                      expect(Homebrew::Overlay).to receive(:begin_formula_transaction)
                        .with(formula, base_generation: generation)
                        .and_return(transaction)

                      session = described_class.new
                      session.start!(formula)

                      expect(session).to be_managed
                      expect(session.build_environment).to eq(
                        "HOMEBREW_OVERLAY_INSTALL_TRANSACTION_ID" => "123",
                      )
                      expect(sandbox).to receive(:allow_read_if_exists).with(path: transaction_dir)
                      session.apply_build_sandbox_rules(sandbox)

                      expect(transaction).to receive(:rollback!)
                      session.abort!
                      expect(Homebrew::Overlay).to receive(:release_base_mutation_lease).with(lease)
                      session.close!
                    end

                    it "commits a local realization through one durable session boundary" do
                      lease = instance_double(File)
                      allow(Homebrew::Overlay).to receive_messages(
                        active?:                     true,
                        acquire_base_mutation_lease: lease,
                        begin_formula_transaction:   nil,
                        current_base_generation:     generation,
                      )
                      allow(Homebrew::EnvConfig).to receive(:overlay?).and_return(true)
                      expect(Homebrew::Overlay).to receive(:validate_local_install_target!).with("foo", "2.0")
                      expect(Homebrew::Overlay).to receive(:begin_mutation!)

                      session = described_class.new
                      session.start!(formula)

                      expect(Homebrew::Overlay).to receive(:verify_base_generation!).with(generation).exactly(3).times
                      expect(Homebrew::Overlay).to receive(:record_base_generation!).with(keg.to_path, generation)
                      expect(Homebrew::Overlay).to receive(:bump_generation!)
                      session.commit!(keg)

                      expect(Homebrew::Overlay).not_to receive(:discard_local_keg!)
                      expect(Homebrew::Overlay).not_to receive(:sync!)
                      session.abort!
                      expect(Homebrew::Overlay).to receive(:release_base_mutation_lease).with(lease)
                      session.close!
                    end

                    it "raises when Homebrew reports failure before the package boundary" do
                      allow(Homebrew::Overlay).to receive_messages(
                        active?:                     true,
                        acquire_base_mutation_lease: instance_double(File),
                        begin_formula_transaction:   nil,
                        current_base_generation:     generation,
                      )
                      allow(Homebrew::EnvConfig).to receive(:overlay?).and_return(true)
                      allow(Homebrew).to receive(:failed?).and_return(false, true)
                      allow(Homebrew::Overlay).to receive_messages(
                        begin_mutation!:         nil,
                        verify_base_generation!: nil,
                      )

                      session = described_class.new
                      session.start!(formula)

                      expect do
                        session.validate_install!
                      end.to raise_error(
                        Homebrew::Overlay::TransactionFailure,
                        /failed before its private keg was committed/,
                      )
                    end

                    it "discards an uncommitted new local keg and finalizes its mutation" do
                      lease = instance_double(File)
                      allow(Homebrew::Overlay).to receive_messages(
                        active?:                     true,
                        acquire_base_mutation_lease: lease,
                        begin_formula_transaction:   nil,
                        current_base_generation:     generation,
                      )
                      allow(Homebrew::Overlay).to receive(:mutation_active?).and_return(false, true)
                      allow(Homebrew::EnvConfig).to receive(:overlay?).and_return(true)
                      expect(Homebrew::Overlay).to receive(:begin_mutation!)

                      session = described_class.new
                      session.start!(formula)

                      expect(Homebrew::Overlay).to receive(:discard_local_keg!).with("foo", "2.0")
                      expect(Homebrew::Overlay).to receive(:sync!).with(mutation: true)
                      session.abort!
                      expect(Homebrew::Overlay).to receive(:release_base_mutation_lease).with(lease)
                      session.close!
                    end

                    it "preserves a pre-existing local keg when installation aborts" do
                      allow(Homebrew::Overlay).to receive_messages(
                        active?:                     true,
                        acquire_base_mutation_lease: instance_double(File),
                        begin_formula_transaction:   nil,
                        current_base_generation:     generation,
                        local_keg_realization?:      true,
                      )
                      allow(Homebrew::EnvConfig).to receive(:overlay?).and_return(true)
                      allow(Homebrew::Overlay).to receive_messages(
                        begin_mutation!: nil,
                        sync!:           nil,
                      )

                      session = described_class.new
                      session.start!(formula)

                      expect(Homebrew::Overlay).not_to receive(:discard_local_keg!)
                      session.abort!
                    end

                    it "closes the failure scope and lease after rollback errors" do
                      lease = instance_double(File)
                      transaction = instance_double(
                        Homebrew::Overlay::FormulaTransaction,
                        finished?: false,
                      )
                      allow(Homebrew::Overlay).to receive_messages(
                        active?:                     true,
                        acquire_base_mutation_lease: lease,
                        begin_formula_transaction:   transaction,
                        current_base_generation:     generation,
                        mutation_active?:            true,
                      )
                      allow(Homebrew).to receive(:failed?).and_return(true, false)
                      session = described_class.new
                      session.start!(formula)

                      expect(transaction).to receive(:rollback!).and_raise(
                        Homebrew::Overlay::TransactionFailure,
                        "rollback failed",
                      )
                      expect do
                        begin
                          session.abort!
                        ensure
                          session.close!
                        end
                      end.to raise_error(Homebrew::Overlay::TransactionFailure, "rollback failed")
                      expect(Homebrew).to have_received(:failed=).with(false)
                      expect(Homebrew).to have_received(:failed=).with(true)
                      expect(Homebrew::Overlay).to have_received(:release_base_mutation_lease).with(lease)
                    end

                    it "finishes a writable administrator mutation after native install work" do
                      allow(Homebrew::EnvConfig).to receive(:overlay?).and_return(true)
                      expect(Homebrew::Overlay).to receive(:begin_mutation!)

                      session = described_class.new
                      session.start!(formula)

                      expect(session).not_to be_managed
                      expect(Homebrew::Overlay).to receive(:bump_generation!)
                      session.complete_native_install!
                    end
                  end
                  '''
              ).lstrip(),
              encoding="utf-8",
          )

          formula_spec = Path("Library/Homebrew/test/formula_installer_spec.rb")
          source = formula_spec.read_text(encoding="utf-8")
          start_marker = '    it "discards an uncommitted local overlay keg when generation validation fails" do\n'
          end_marker = '    it "runs structured post-install work through the post-install subprocess" do\n'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("could not locate legacy FormulaInstaller overlay test block")
          replacement = dedent(
              '''
                  it "aborts and closes the overlay session when publication validation fails" do
                    formula = formula "overlay-generation-race" do
                      T.bind(self, T.class_of(Formula))
                      url "foo-1.0"
                    end
                    error = Homebrew::Overlay::BaseGenerationChangedError.new("a" * 64, "b" * 64)
                    session = instance_double(Homebrew::Overlay::InstallSession)

                    allow(Homebrew::Overlay::InstallSession).to receive(:new).and_return(session)
                    installer = described_class.new(formula)
                    allow(installer).to receive_messages(only_deps?: false, unlock: nil, verbose?: false)

                    expect(session).to receive(:publish!).ordered.and_raise(error)
                    expect(session).to receive(:abort!).ordered
                    expect(session).to receive(:close!).ordered

                    expect { installer.finish }.to raise_error(error)
                  end

                  it "commits an overlay replacement before native link side effects" do
                    formula = formula "overlay-commit-boundary" do
                      T.bind(self, T.class_of(Formula))
                      url "foo-1.0"
                    end
                    keg = instance_double(Keg)
                    session = instance_double(Homebrew::Overlay::InstallSession)

                    allow(Homebrew::Overlay::InstallSession).to receive(:new).and_return(session)
                    installer = described_class.new(formula)
                    allow(Keg).to receive(:new).with(formula.prefix).and_return(keg)
                    allow(installer).to receive_messages(
                      fix_dynamic_linkage: nil,
                      only_deps?:          false,
                      unlock:              nil,
                      verbose?:            false,
                    )

                    expect(session).to receive(:publish!).ordered
                    expect(session).to receive(:managed?).ordered.and_return(true)
                    expect(installer).to receive(:fix_dynamic_linkage).with(keg).ordered
                    expect(session).to receive(:commit!).with(keg).ordered
                    expect(installer).to receive(:link).with(keg).ordered.and_raise("link failed")
                    expect(session).to receive(:abort!).ordered
                    expect(session).to receive(:close!).ordered

                    expect { installer.finish }.to raise_error("link failed")
                  end

              '''
          )
          formula_spec.write_text(source[:start] + replacement + source[end:], encoding="utf-8")

          Path("Library/Homebrew/test/support/overlay_architecture_test.sh").write_text(
              dedent(
                  '''
                  #!/bin/bash
                  set -euo pipefail

                  repo="${1:-$(cd "$(dirname "${BASH_SOURCE[0]}")/../../../.." && pwd -P)}"
                  repo="$(cd "${repo}" && pwd -P)"
                  ruby_loader="${repo}/Library/Homebrew/overlay.rb"
                  ruby_impl="${repo}/Library/Homebrew/overlay"
                  shell_loader="${repo}/Library/Homebrew/utils/overlay.sh"
                  shell_impl="${repo}/Library/Homebrew/utils/overlay"
                  formula_installer="${repo}/Library/Homebrew/formula_installer.rb"
                  reinstall_adapter="${repo}/Library/Homebrew/reinstall/reinstall.rb"

                  [[ "$(wc -l <"${ruby_loader}")" -le 15 ]] || {
                    echo "Error: public Ruby overlay loader accumulated implementation" >&2
                    exit 1
                  }
                  [[ "$(wc -l <"${shell_loader}")" -le 20 ]] || {
                    echo "Error: public shell overlay loader accumulated implementation" >&2
                    exit 1
                  }

                  grep -Fx 'require "overlay/core"' "${ruby_loader}" >/dev/null || {
                    echo "Error: public Ruby overlay loader no longer loads overlay/core" >&2
                    exit 1
                  }
                  grep -Fx 'require "overlay/install_session"' "${ruby_loader}" >/dev/null || {
                    echo "Error: public Ruby overlay loader no longer loads the install session" >&2
                    exit 1
                  }
                  grep -Fx 'require "overlay/reinstall_session"' "${ruby_loader}" >/dev/null || {
                    echo "Error: public Ruby overlay loader no longer loads the reinstall session" >&2
                    exit 1
                  }
                  grep -F 'overlay/core.sh' "${shell_loader}" >/dev/null || {
                    echo "Error: public shell overlay loader no longer loads overlay/core.sh" >&2
                    exit 1
                  }

                  grep -F 'Homebrew::Overlay::ReinstallSession.build' "${reinstall_adapter}" >/dev/null || {
                    echo "Error: reinstall no longer delegates through the overlay session" >&2
                    exit 1
                  }
                  if grep -Eq 'Homebrew::Overlay::(ReinstallBackup|inherited_keg\?|mutation_active\?|begin_mutation!|sync!)' \
                    "${reinstall_adapter}"
                  then
                    echo "Error: overlay reinstall policy leaked back into the upstream-facing adapter" >&2
                    exit 1
                  fi

                  grep -F 'Homebrew::Overlay::InstallSession.new' "${formula_installer}" >/dev/null || {
                    echo "Error: FormulaInstaller no longer constructs InstallSession" >&2
                    exit 1
                  }
                  grep -F '@overlay_install_session.start!(formula)' "${formula_installer}" >/dev/null || {
                    echo "Error: FormulaInstaller no longer passes its current formula at install start" >&2
                    exit 1
                  }
                  if grep -Fq 'InstallSession.new(@formula)' "${formula_installer}"
                  then
                    echo "Error: FormulaInstaller captured a potentially stale formula in InstallSession" >&2
                    exit 1
                  fi
                  for legacy_state in \
                    @overlay_transaction \
                    @overlay_base_generation \
                    @overlay_local_keg_preexisting \
                    @overlay_local_keg_committed \
                    @overlay_mutation_owned \
                    @overlay_previous_failed \
                    @overlay_base_mutation_lease \
                    verify_overlay_base_generation! \
                    raise_overlay_transaction_failure! \
                    rollback_overlay_uncommitted_local_keg! \
                    finalize_failed_overlay_mutation! \
                    restore_overlay_failure_scope! \
                    release_overlay_base_mutation_lease!
                  do
                    if grep -Fq "${legacy_state}" "${formula_installer}"
                    then
                      echo "Error: FormulaInstaller owns legacy overlay state: ${legacy_state}" >&2
                      exit 1
                    fi
                  done

                  while IFS= read -r file
                  do
                    case "${file}" in
                      "${ruby_loader}" | "${ruby_impl}"/*) continue ;;
                      *) ;;
                    esac
                    if grep -Eq 'require[[:space:]]+"overlay/' "${file}"
                    then
                      echo "Error: Homebrew-owned Ruby code bypasses the public overlay loader: ${file#"${repo}/"}" >&2
                      exit 1
                    fi
                  done < <(find "${repo}/Library/Homebrew" -type f -name '*.rb' -print)

                  while IFS= read -r file
                  do
                    case "${file}" in
                      "${shell_loader}" | "${shell_impl}"/* | "${repo}/Library/Homebrew/test/"*) continue ;;
                      *) ;;
                    esac
                    if grep -Fq 'overlay/core.sh' "${file}"
                    then
                      echo "Error: Homebrew-owned shell code bypasses the public overlay loader: ${file#"${repo}/"}" >&2
                      exit 1
                    fi
                  done < <(
                    find "${repo}/Library/Homebrew" "${repo}/bin" -type f \
                      \( -name '*.sh' -o -path "${repo}/bin/brew" \) -print
                  )

                  printf 'overlay architecture boundary: PASS\n'
                  '''
              ).lstrip(),
              encoding="utf-8",
          )

          replace_once(
              "Library/Homebrew/overlay/README.md",
              "- `install_session.rb` owns the lease, transaction, generation, and failure\n"
              "  scope spanning `FormulaInstaller#install` and `#finish`.\n",
              "- `install_session.rb` captures the current formula identity at install start\n"
              "  and owns the lease, transaction, generation, and failure scope spanning\n"
              "  `FormulaInstaller#install` and `#finish`.\n",
          )
          PY

          git rm .github/workflows/zz-overlay-test-seam-refactor.yml
          git diff --check
          bash -n Library/Homebrew/test/support/overlay_architecture_test.sh
          ruby -c Library/Homebrew/formula_installer.rb
          ruby -c Library/Homebrew/overlay/install_session.rb
          ruby -c Library/Homebrew/test/formula_installer_spec.rb
          ruby -c Library/Homebrew/test/overlay/install_session_spec.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Library/Homebrew/formula_installer.rb \
            Library/Homebrew/overlay/README.md \
            Library/Homebrew/overlay/install_session.rb \
            Library/Homebrew/test/formula_installer_spec.rb \
            Library/Homebrew/test/overlay/install_session_spec.rb \
            Library/Homebrew/test/support/overlay_architecture_test.sh
          git commit -m "Finalize overlay install session boundary"
          git push origin HEAD:refactor/overlay-maintainability
